<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Kelas - Admin</title>
  <link rel="stylesheet" href="admin-style.css">
  <style>
    .img-preview { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; margin-top: 10px; border: 1px solid #e2e8f0; display: block; }
  </style>
  <script>
    if (localStorage.getItem('isAdminLoggedIn') !== 'true') { window.location.href = 'login.html'; }
  </script>
</head>
<body>

  <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.add('active')">☰</button>

  <aside class="sidebar">
    <button class="close-menu" onclick="document.querySelector('.sidebar').classList.remove('active')">✕</button>
    <a href="dashboard.html" class="logo"><img src="../img/SELARAS.png" alt="Logo"></a>
    <div class="menu-group">
      <a href="dashboard.html" class="menu-item">Dashboard</a>
      <a href="classes.html" class="menu-item active">Kelola Event</a>
      <a href="orders.html" class="menu-item">Data Pesanan</a>
      <a href="gallery.html" class="menu-item">Kelola Galeri</a>
      <a href="partners.html" class="menu-item">Kelola Partner</a>
      <a href="messages.html" class="menu-item">Pesan Masuk</a>
      <a href="settings.html" class="menu-item">Pengaturan Web</a>
    </div>
    <div class="menu-group" style="margin-top: auto;">
      <a href="#" onclick="logout()" class="menu-item" style="color: #f87171;">Logout</a>
    </div>
  </aside>

  <main class="main-content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
      <div>
        <h1 class="page-title">Edit Kelas</h1>
        <p class="page-subtitle" style="margin-bottom: 0;">Perbarui jadwal kelas.</p>
      </div>
      <a href="classes.html" class="btn btn-outline">Batal & Kembali</a>
    </div>

    <div class="table-wrapper" style="padding: 30px; max-width: 700px;">
      <form id="formEditKelas">
        
        <div class="form-group">
          <label>Status Kelas *</label>
          <select id="statusAktif" class="form-control" required>
            <option value="true">Aktif (Buka Pendaftaran)</option>
            <option value="false">Non-Aktif (Tutup Pendaftaran)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Nama Kelas *</label>
          <input type="text" id="inpNama" class="form-control" required>
        </div>

        <div class="form-group">
          <label>Kategori Event *</label>
          <select id="inpKategori" class="form-control" required>
            <option value="Yoga">Yoga</option>
            <option value="Pilates">Pilates</option>
            <option value="Sound Healing">Sound Healing</option>
            <option value="Art & Craft">Art & Craft</option>
            <option value="Retreat">Retreat</option>
            <option value="Journaling">Journaling</option>
          </select>
        </div>

        <div class="form-group">
          <label>Nama Coach *</label>
          <input type="text" id="inpCoach" class="form-control" required>
        </div>

        <div style="display: flex; gap: 20px;">
          <div class="form-group" style="flex: 1;">
            <label>Tanggal Kelas *</label>
            <input type="date" id="inpTanggal" class="form-control" required>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Jam Kelas *</label>
            <input type="time" id="inpJam" class="form-control" required>
          </div>
        </div>

        <div class="form-group">
          <label>Lokasi *</label>
          <input type="text" id="inpLokasi" class="form-control" required>
        </div>

        <div style="display: flex; gap: 20px;">
          <div class="form-group" style="flex: 1;">
            <label>Harga Satuan (Rp) *</label>
            <input type="number" id="inpHarga" class="form-control" required>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Harga Bundling (Rp) *</label>
            <input type="number" id="inpHargaBundling" class="form-control" required>
          </div>
        </div>

        <!-- BAGIAN KUOTA (CUMA 1 KOLOM) -->
        <div class="form-group">
          <label>Total Kuota Awal *</label>
          <input type="number" id="inpKuotaAwal" class="form-control" required>
          <small style="font-size: 0.8rem; color: #64748b; margin-top: 5px; display: block;">
            *Sisa kuota akan dihitung otomatis berdasarkan jumlah pendaftar.
          </small>
        </div>

        <div class="form-group">
          <label>Gambar Saat Ini:</label>
          <img id="previewGambar" src="" alt="Gambar Kelas" class="img-preview">
        </div>

        <div class="form-group">
          <label>Ganti Gambar (Biarkan kosong jika tidak diganti)</label>
          <input type="file" id="inpGambarBaru" class="form-control" accept="image/*" style="background: #fff;">
        </div>

        <div class="form-group">
          <label>Deskripsi Singkat</label>
          <textarea id="inpDeskripsi" class="form-control" rows="3"></textarea>
        </div>

        <button type="submit" id="btnSimpan" class="btn btn-primary" style="width: 100%; margin-top: 20px;">Simpan Perubahan</button>
      </form>
    </div>
  </main>

    <script type="module">
    import { firebaseConfig, app } from '../firebase-config.js';
    import { getFirestore, doc, getDoc, updateDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);
    const urlParams = new URLSearchParams(window.location.search);
    const idKelas = urlParams.get('id');
    const form = document.getElementById('formEditKelas');
    const btnSimpan = document.getElementById('btnSimpan');
    const previewGambar = document.getElementById('previewGambar');

    let dataAsli = {};

    async function loadDataKelas() {
      if (!idKelas) { window.location.href = 'classes.html'; return; }
      try {
        const docSnap = await getDoc(doc(db, "classes", idKelas));
        if (docSnap.exists()) {
          dataAsli = docSnap.data();
          
          document.getElementById('statusAktif').value = dataAsli.statusAktif !== false ? "true" : "false";
          document.getElementById('inpNama').value = dataAsli.nama;
          document.getElementById('inpKategori').value = dataAsli.kategori || 'Yoga';
          document.getElementById('inpCoach').value = dataAsli.coach || '';
          document.getElementById('inpTanggal').value = dataAsli.tanggal || '';
          document.getElementById('inpJam').value = dataAsli.jam || '';
          document.getElementById('inpLokasi').value = dataAsli.lokasi || '';
          document.getElementById('inpHarga').value = dataAsli.harga;
          document.getElementById('inpHargaBundling').value = dataAsli.hargaBundling || 0;
          
          document.getElementById('inpKuotaAwal').value = dataAsli.kuotaAwal || 0;
          document.getElementById('inpDeskripsi').value = dataAsli.deskripsi || '';
          
          if (dataAsli.gambar) previewGambar.src = dataAsli.gambar;
        }
      } catch (error) { console.error(error); }
    }
    loadDataKelas();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnSimpan.innerText = 'Menghitung & Menyimpan...';
      btnSimpan.disabled = true;

      try {
        let newImageUrl = null;
        const fileGambar = document.getElementById('inpGambarBaru').files[0];

        if (fileGambar) {
          const cloudName = 'd4cltmgp'; // CLOUD NAME KAMU
          const uploadPreset = 'selaras_bukti';

          const formData = new FormData();
          formData.append('file', fileGambar);
          formData.append('upload_preset', uploadPreset);

          const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
            method: 'POST',
            body: formData
          });
          const data = await response.json();
          newImageUrl = data.secure_url;
        }

        // --- LOGIKA HITUNG ULANG SISA KUOTA DARI TABEL ORDERS ---
        const kuotaAwalBaru = parseInt(document.getElementById('inpKuotaAwal').value);
        
        // 1. Ambil semua pesanan untuk kelas ini yang statusnya "Success"
        const ordersRef = collection(db, "orders");
        const q = query(ordersRef, where("kelas", "==", dataAsli.nama), where("status", "==", "Success"));
        const querySnapshot = await getDocs(q);
        
        // 2. Hitung total peserta yang sudah daftar (termasuk bundling)
        let totalPeserta = 0;
        querySnapshot.forEach((doc) => {
          const order = doc.data();
          totalPeserta += (order.jumlahPeserta || 1);
        });

        // 3. Hitung sisa kuota baru
        let kuotaFinal = kuotaAwalBaru - totalPeserta;
        if (kuotaFinal < 0) kuotaFinal = 0; // Jangan sampai minus
        // --------------------------------------------------------

        const updateData = {
          statusAktif: document.getElementById('statusAktif').value === "true",
          nama: document.getElementById('inpNama').value,
          kategori: document.getElementById('inpKategori').value,
          coach: document.getElementById('inpCoach').value,
          tanggal: document.getElementById('inpTanggal').value,
          jam: document.getElementById('inpJam').value,
          lokasi: document.getElementById('inpLokasi').value,
          harga: parseInt(document.getElementById('inpHarga').value),
          hargaBundling: parseInt(document.getElementById('inpHargaBundling').value),
          
          kuotaAwal: kuotaAwalBaru,
          kuotaTersisa: kuotaFinal, // Hasil hitungan ulang yang akurat
          
          deskripsi: document.getElementById('inpDeskripsi').value
        };

        if (newImageUrl) updateData.gambar = newImageUrl;

        await updateDoc(doc(db, "classes", idKelas), updateData);
        alert(`Perubahan disimpan! Total pendaftar: ${totalPeserta} orang. Sisa kuota: ${kuotaFinal}.`);
        window.location.href = 'classes.html';
      } catch (error) {
        console.error(error);
        alert('Gagal menyimpan.');
      } finally {
        btnSimpan.innerText = 'Simpan Perubahan';
        btnSimpan.disabled = false;
      }
    });

    window.logout = function() {
      localStorage.removeItem('isAdminLoggedIn');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
