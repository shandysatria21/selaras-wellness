<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Kelas - Admin</title>
  <link rel="stylesheet" href="admin-style.css">
  <style>
    .img-preview { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; margin-top: 10px; border: 1px solid #e2e8f0; display: block; }
  </style>
  <script>
    if (localStorage.getItem('isAdminLoggedIn') !== 'true') { window.location.href = 'login.html'; }
  </script>
</head>
<body>
<button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.add('active')">☰</button>
  <aside class="sidebar">
     <button class="close-menu" onclick="document.querySelector('.sidebar').classList.remove('active')">✕</button>
    <a href="dashboard.html" class="logo"><img src="../img/SELARAS.png" alt="Logo"></a>
    <div class="menu-group">
      <a href="dashboard.html" class="menu-item">Dashboard</a>
      <a href="classes.html" class="menu-item active">Kelola Kelas</a>
      <a href="orders.html" class="menu-item">Data Pesanan</a>
      <a href="gallery.html" class="menu-item">Kelola Galeri</a>
      <a href="messages.html" class="menu-item">Pesan Masuk</a>
      <a href="settings.html" class="menu-item">Pengaturan Web</a>
    </div>
    <div class="menu-group" style="margin-top: auto;">
      <a href="#" onclick="logout()" class="menu-item" style="color: #f87171;">Logout</a>
    </div>
  </aside>

  <main class="main-content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
      <div>
        <h1 class="page-title">Edit Kelas</h1>
        <p class="page-subtitle" style="margin-bottom: 0;">Perbarui jadwal kelas.</p>
      </div>
      <a href="classes.html" class="btn btn-outline">Batal & Kembali</a>
    </div>

    <div class="table-wrapper" style="padding: 30px; max-width: 700px;">
      <form id="formEditKelas">
        
        <div class="form-group">
          <label>Status Kelas *</label>
          <select id="statusAktif" class="form-control" required>
            <option value="true">Aktif (Buka Pendaftaran)</option>
            <option value="false">Non-Aktif (Tutup Pendaftaran)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Nama Kelas *</label>
          <input type="text" id="inpNama" class="form-control" required>
        </div>

        <div class="form-group">
          <label>Nama Coach *</label>
          <input type="text" id="inpCoach" class="form-control" required>
        </div>

        <div class="form-group">
          <label>Tanggal Kelas *</label>
          <input type="date" id="inpTanggal" class="form-control" required>
        </div>

        <div class="form-group">
          <label>Lokasi *</label>
          <input type="text" id="inpLokasi" class="form-control" required>
        </div>

        <div style="display: flex; gap: 20px;">
          <div class="form-group" style="flex: 1;">
            <label>Harga (Rp) *</label>
            <input type="number" id="inpHarga" class="form-control" required>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Kuota Tersisa *</label>
            <input type="number" id="inpKuota" class="form-control" required>
          </div>
        </div>

        <div class="form-group">
          <label>Gambar Saat Ini:</label>
          <img id="previewGambar" src="" alt="Gambar Kelas" class="img-preview">
        </div>

        <div class="form-group">
          <label>Ganti Gambar (Biarkan kosong jika tidak diganti)</label>
          <input type="file" id="inpGambarBaru" class="form-control" accept="image/*" style="background: #fff;">
        </div>

        <div class="form-group">
          <label>Deskripsi Singkat</label>
          <textarea id="inpDeskripsi" class="form-control" rows="3"></textarea>
        </div>

        <button type="submit" id="btnSimpan" class="btn btn-primary" style="width: 100%; margin-top: 20px;">Simpan Perubahan</button>
      </form>
    </div>
  </main>

  <script type="module">
    import { firebaseConfig, app } from '../firebase-config.js';
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);
    const urlParams = new URLSearchParams(window.location.search);
    const idKelas = urlParams.get('id');
    const form = document.getElementById('formEditKelas');
    const btnSimpan = document.getElementById('btnSimpan');
    const previewGambar = document.getElementById('previewGambar');

    async function loadDataKelas() {
      if (!idKelas) { window.location.href = 'classes.html'; return; }
      try {
        const docSnap = await getDoc(doc(db, "classes", idKelas));
        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById('statusAktif').value = data.statusAktif !== false ? "true" : "false";
          document.getElementById('inpNama').value = data.nama;
          document.getElementById('inpCoach').value = data.coach || '';
          document.getElementById('inpTanggal').value = data.tanggal || '';
          document.getElementById('inpLokasi').value = data.lokasi || '';
          document.getElementById('inpHarga').value = data.harga;
          document.getElementById('inpKuota').value = data.kuotaTersisa || 0;
          document.getElementById('inpDeskripsi').value = data.deskripsi || '';
          
          if (data.gambar) previewGambar.src = data.gambar;
        }
      } catch (error) { console.error(error); }
    }
    loadDataKelas();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnSimpan.innerText = 'Menyimpan...';
      btnSimpan.disabled = true;

      try {
        let newImageUrl = null;
        const fileGambar = document.getElementById('inpGambarBaru').files[0];

        if (fileGambar) {
          const cloudName = 'd4cltmgp'; // GANTI DENGAN CLOUD NAME KAMU
          const uploadPreset = 'selaras_bukti';

          const formData = new FormData();
          formData.append('file', fileGambar);
          formData.append('upload_preset', uploadPreset);

          const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
            method: 'POST',
            body: formData
          });
          const data = await response.json();
          newImageUrl = data.secure_url;
        }

        const updateData = {
          statusAktif: document.getElementById('statusAktif').value === "true",
          nama: document.getElementById('inpNama').value,
          coach: document.getElementById('inpCoach').value,
          tanggal: document.getElementById('inpTanggal').value,
          lokasi: document.getElementById('inpLokasi').value,
          harga: parseInt(document.getElementById('inpHarga').value),
          kuotaTersisa: parseInt(document.getElementById('inpKuota').value),
          deskripsi: document.getElementById('inpDeskripsi').value
        };

        if (newImageUrl) updateData.gambar = newImageUrl;

        await updateDoc(doc(db, "classes", idKelas), updateData);
        alert('Perubahan berhasil disimpan!');
        window.location.href = 'classes.html';
      } catch (error) {
        console.error(error);
        alert('Gagal menyimpan.');
      } finally {
        btnSimpan.innerText = 'Simpan Perubahan';
        btnSimpan.disabled = false;
      }
    });

    window.logout = function() {
      localStorage.removeItem('isAdminLoggedIn');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
