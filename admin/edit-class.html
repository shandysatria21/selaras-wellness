<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Kelas - Admin</title>
  <link rel="stylesheet" href="admin-style.css">
  <script>
    // Proteksi Halaman
    if (localStorage.getItem('isAdminLoggedIn') !== 'true') {
      window.location.href = 'login.html';
    }
  </script>
</head>
<body>

  <!-- SIDEBAR ADMIN -->
  <aside class="sidebar">
    <a href="dashboard.html" class="logo">ADMIN PANEL</a>
    <div class="menu-group">
      <a href="dashboard.html" class="menu-item">Dashboard</a>
      <a href="classes.html" class="menu-item active">Kelola Kelas</a>
      <a href="orders.html" class="menu-item">Data Pesanan</a>
      <a href="gallery.html" class="menu-item">Kelola Galeri</a>
      <a href="settings.html" class="menu-item">Pengaturan Web</a>
    </div>
    <div class="menu-group" style="margin-top: auto;">
      <a href="#" onclick="logout()" class="menu-item" style="color: #f87171;">Logout</a>
    </div>
  </aside>

  <!-- KONTEN ADMIN -->
  <main class="main-content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
      <div>
        <h1 class="page-title">Edit Kelas</h1>
        <p class="page-subtitle" style="margin-bottom: 0;">Perbarui informasi kelas yoga di bawah ini.</p>
      </div>
      <a href="classes.html" class="btn btn-outline">Batal & Kembali</a>
    </div>

    <!-- Form Edit Kelas -->
    <div class="table-wrapper" style="padding: 30px; max-width: 700px;">
      <form onsubmit="event.preventDefault(); alert('Perubahan kelas berhasil disimpan! (Simulasi)'); window.location.href='classes.html';">
        
        <div class="form-group">
          <label>Nama Kelas *</label>
          <input type="text" id="inpNama" class="form-control" required>
        </div>

        <div style="display: flex; gap: 20px;">
          <div class="form-group" style="flex: 1;">
            <label>Harga (Rp) *</label>
            <input type="number" id="inpHarga" class="form-control" required>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Durasi (Menit) *</label>
            <input type="number" id="inpDurasi" class="form-control" required>
          </div>
        </div>

        <div class="form-group">
          <label>Level Kelas *</label>
          <select id="inpLevel" class="form-control" required>
            <option value="all">All Levels</option>
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
        </div>

        <div class="form-group">
          <label>Ganti Gambar Kelas (Biarkan kosong jika tidak diganti)</label>
          <input type="file" class="form-control" accept="image/*" style="background: #fff;">
        </div>

        <div class="form-group">
          <label>Deskripsi Singkat</label>
          <textarea class="form-control" rows="3">Kelas yoga yang menenangkan dan cocok untuk relaksasi.</textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px;">Simpan Perubahan</button>
      </form>
    </div>

  </main>

  <script>
    // 1. Ambil data dari URL
    const urlParams = new URLSearchParams(window.location.search);
    const nama = urlParams.get('nama') || 'Nama Kelas Default';
    const harga = urlParams.get('harga') || '0';
    const durasi = urlParams.get('durasi') || '60';
    const level = urlParams.get('level') || 'all';

    // 2. Isi otomatis ke dalam form
    document.getElementById('inpNama').value = nama;
    document.getElementById('inpHarga').value = harga;
    document.getElementById('inpDurasi').value = durasi;
    document.getElementById('inpLevel').value = level;

    // Fungsi Logout
    function logout() {
      localStorage.removeItem('isAdminLoggedIn');
      window.location.href = 'login.html';
    }
  </script>

</body>
</html>
