<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Kelas - Admin</title>
  <link rel="stylesheet" href="admin-style.css">
  <style>
    .img-preview { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; margin-top: 10px; border: 1px solid #e2e8f0; display: block; }
  </style>
  <script>
    if (localStorage.getItem('isAdminLoggedIn') !== 'true') {
      window.location.href = 'login.html';
    }
  </script>
</head>
<body>

  <aside class="sidebar">
    <a href="dashboard.html" class="logo">ADMIN PANEL</a>
    <div class="menu-group">
      <a href="dashboard.html" class="menu-item">Dashboard</a>
      <a href="classes.html" class="menu-item active">Kelola Kelas</a>
      <a href="orders.html" class="menu-item">Data Pesanan</a>
      <a href="gallery.html" class="menu-item">Kelola Galeri</a>
      <a href="settings.html" class="menu-item">Pengaturan Web</a>
    </div>
    <div class="menu-group" style="margin-top: auto;">
      <a href="#" onclick="logout()" class="menu-item" style="color: #f87171;">Logout</a>
    </div>
  </aside>

  <main class="main-content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
      <div>
        <h1 class="page-title">Edit Kelas</h1>
        <p class="page-subtitle" style="margin-bottom: 0;">Perbarui informasi kelas yoga di bawah ini.</p>
      </div>
      <a href="classes.html" class="btn btn-outline">Batal & Kembali</a>
    </div>

    <div class="table-wrapper" style="padding: 30px; max-width: 700px;">
      <form id="formEditKelas">
        
        <div class="form-group">
          <label>Nama Kelas *</label>
          <input type="text" id="inpNama" class="form-control" required>
        </div>

        <div style="display: flex; gap: 20px;">
          <div class="form-group" style="flex: 1;">
            <label>Harga (Rp) *</label>
            <input type="number" id="inpHarga" class="form-control" required>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Durasi (Menit) *</label>
            <input type="number" id="inpDurasi" class="form-control" required>
          </div>
        </div>

        <div class="form-group">
          <label>Level Kelas *</label>
          <select id="inpLevel" class="form-control" required>
            <option value="All levels">All levels</option>
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
          </select>
        </div>

        <div class="form-group">
          <label>Gambar Saat Ini:</label>
          <img id="previewGambar" src="" alt="Gambar Kelas" class="img-preview">
        </div>

        <div class="form-group">
          <label>Link URL Gambar Baru (Biarkan kosong jika tidak diganti)</label>
          <input type="url" id="inpGambar" class="form-control" placeholder="https://images.unsplash.com/..." >
        </div>

        <div class="form-group">
          <label>Deskripsi Singkat</label>
          <textarea id="inpDeskripsi" class="form-control" rows="3"></textarea>
        </div>

        <button type="submit" id="btnSimpan" class="btn btn-primary" style="width: 100%; margin-top: 20px;">Simpan Perubahan</button>
      </form>
    </div>
  </main>

  <script type="module">
    import { firebaseConfig, app } from '../firebase-config.js';
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const idKelas = urlParams.get('id');

    const form = document.getElementById('formEditKelas');
    const btnSimpan = document.getElementById('btnSimpan');
    const previewGambar = document.getElementById('previewGambar');

    // 1. Ambil Data dari Database
    async function loadDataKelas() {
      if (!idKelas) {
        alert("ID Kelas tidak ditemukan!");
        window.location.href = 'classes.html';
        return;
      }

      try {
        const docRef = doc(db, "classes", idKelas);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById('inpNama').value = data.nama;
          document.getElementById('inpHarga').value = data.harga;
          document.getElementById('inpDurasi').value = data.durasi;
          
          // Perbaikan Dropdown Level
          const selectLevel = document.getElementById('inpLevel');
          for (let i = 0; i < selectLevel.options.length; i++) {
            if (selectLevel.options[i].value.toLowerCase() === data.level.toLowerCase()) {
              selectLevel.selectedIndex = i;
              break;
            }
          }
          
          document.getElementById('inpDeskripsi').value = data.deskripsi || '';
          
          if (data.gambar) {
            previewGambar.src = data.gambar;
            previewGambar.style.display = 'block';
          } else {
            previewGambar.style.display = 'none';
          }
        } else {
          alert("Kelas tidak ditemukan di database.");
        }
      } catch (error) {
        console.error("Error load: ", error);
      }
    }

    loadDataKelas();

    // 2. Proses Update ke Database
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnSimpan.innerText = 'Menyimpan...';
      btnSimpan.disabled = true;

      try {
        // Siapkan data
        const updateData = {
          nama: document.getElementById('inpNama').value,
          harga: parseInt(document.getElementById('inpHarga').value),
          durasi: parseInt(document.getElementById('inpDurasi').value),
          level: document.getElementById('inpLevel').value,
          deskripsi: document.getElementById('inpDeskripsi').value
        };

        // Cek apakah admin mengisi Link Gambar Baru
        const linkGambarBaru = document.getElementById('inpGambar').value;
        if (linkGambarBaru) {
          updateData.gambar = linkGambarBaru;
        }

        // Update Firestore
        await updateDoc(doc(db, "classes", idKelas), updateData);

        alert('Perubahan berhasil disimpan!');
        window.location.href = 'classes.html';
        
      } catch (error) {
        console.error("Error update: ", error);
        alert('Gagal menyimpan. Cek console.');
      } finally {
        btnSimpan.innerText = 'Simpan Perubahan';
        btnSimpan.disabled = false;
      }
    });

    window.logout = function() {
      localStorage.removeItem('isAdminLoggedIn');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
