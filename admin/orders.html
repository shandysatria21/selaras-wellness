<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Pesanan - Admin</title>
  <link rel="stylesheet" href="admin-style.css">
  <script>
    if (localStorage.getItem('isAdminLoggedIn') !== 'true') {
      window.location.href = 'login.html';
    }
  </script>
</head>
<body>

  <aside class="sidebar">
    <a href="dashboard.html" class="logo">ADMIN PANEL</a>
    <div class="menu-group">
      <a href="dashboard.html" class="menu-item">Dashboard</a>
      <a href="classes.html" class="menu-item">Kelola Kelas</a>
      <a href="orders.html" class="menu-item active">Data Pesanan</a>
      <a href="gallery.html" class="menu-item">Kelola Galeri</a>
      <a href="messages.html" class="menu-item">Pesan Masuk</a>
      <a href="settings.html" class="menu-item">Pengaturan Web</a>
    </div>
    <div class="menu-group" style="margin-top: auto;">
      <a href="#" onclick="logout()" class="menu-item" style="color: #f87171;">Logout</a>
    </div>
  </aside>

  <main class="main-content">
    <h1 class="page-title">Data Pesanan</h1>
    <p class="page-subtitle">Semua riwayat pemesanan kelas yoga.</p>

    <div class="table-wrapper">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Nama</th>
            <th>Kelas</th>
            <th>Total</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelPesanan">
          <tr><td colspan="6" style="text-align:center;">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script type="module">
    import { firebaseConfig, app } from '../firebase-config.js';
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);
    const tabelPesanan = document.getElementById('tabelPesanan');

    async function tampilkanPesanan() {
      try {
        // Ambil data dari koleksi "orders", urutkan dari yang terbaru
        const q = query(collection(db, "orders"), orderBy("tanggal", "desc"));
        const querySnapshot = await getDocs(q);
        
        tabelPesanan.innerHTML = '';
        
        if (querySnapshot.empty) {
          tabelPesanan.innerHTML = '<tr><td colspan="6" style="text-align:center;">Belum ada pesanan masuk.</td></tr>';
          return;
        }

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const id = doc.id;
          
          // Format tanggal
          const tanggal = data.tanggal ? data.tanggal.toDate().toLocaleDateString('id-ID') : '-';
          const hargaRupiah = 'Rp ' + data.totalHarga.toLocaleString('id-ID');
          
          // Warna Badge
          let badgeClass = data.status === 'Pending' ? 'status-pending' : 'status-success';

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${tanggal}</td>
            <td>${data.nama}</td>
            <td>${data.kelas}</td>
            <td>${hargaRupiah}</td>
            <td><span class="badge-status ${badgeClass}">${data.status}</span></td>
            <td>
              <a href="order-detail.html?id=${id}" class="btn btn-outline" style="padding: 5px 10px; font-size: 0.8rem; display: inline-block;">Cek Detail</a>
            </td>
          `;
          tabelPesanan.appendChild(tr);
        });
      } catch (error) {
        console.error("Error: ", error);
        tabelPesanan.innerHTML = '<tr><td colspan="6" style="text-align:center; color: red;">Gagal memuat data.</td></tr>';
      }
    }

    tampilkanPesanan();

    window.logout = function() {
      localStorage.removeItem('isAdminLoggedIn');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
