<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Pesanan - Admin</title>
  <link rel="stylesheet" href="admin-style.css">
  <script>
    if (localStorage.getItem('isAdminLoggedIn') !== 'true') {
      window.location.href = 'login.html';
    }
  </script>
</head>
<body>

  <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.add('active')">☰</button>

  <aside class="sidebar">
    <button class="close-menu" onclick="document.querySelector('.sidebar').classList.remove('active')">✕</button>
    <a href="dashboard.html" class="logo"><img src="../img/SELARAS.png" alt="Logo"></a>
    <div class="menu-group">
      <a href="dashboard.html" class="menu-item">Dashboard</a>
      <a href="classes.html" class="menu-item">Kelola Kelas</a>
      <a href="orders.html" class="menu-item active">Data Pesanan</a>
      <a href="gallery.html" class="menu-item">Kelola Galeri</a>
      <a href="messages.html" class="menu-item">Pesan Masuk</a>
      <a href="settings.html" class="menu-item">Pengaturan Web</a>
    </div>
    <div class="menu-group" style="margin-top: auto;">
      <a href="#" onclick="logout()" class="menu-item" style="color: #f87171;">Logout</a>
    </div>
  </aside>

  <main class="main-content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
      <div>
        <h1 class="page-title">Data Pesanan</h1>
        <p class="page-subtitle" style="margin-bottom: 0;">Semua riwayat pemesanan kelas yoga.</p>
      </div>
      <!-- TOMBOL EKSPOR CSV -->
      <button id="btnEkspor" class="btn btn-primary" style="background-color: #10b981; border-color: #10b981;" onclick="eksporCSV()">
        ⬇️ Ekspor ke CSV (Excel)
      </button>
    </div>

    <div class="table-wrapper">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Nama</th>
            <th>Email</th>
            <th>WA</th>
            <th>Kelas</th>
            <th>Total</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelPesanan">
          <tr><td colspan="8" style="text-align:center;">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script type="module">
    import { firebaseConfig, app } from '../firebase-config.js';
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);
    const tabelPesanan = document.getElementById('tabelPesanan');
    let semuaDataPesanan = []; // Variabel untuk menyimpan data sebelum diekspor

    // 1. Fungsi Ambil Data dari Database
    async function tampilkanPesanan() {
      try {
        const q = query(collection(db, "orders"), orderBy("tanggal", "desc"));
        const querySnapshot = await getDocs(q);
        
        tabelPesanan.innerHTML = '';
        semuaDataPesanan = []; // Kosongkan array setiap kali load
        
        if (querySnapshot.empty) {
          tabelPesanan.innerHTML = '<tr><td colspan="8" style="text-align:center;">Belum ada pesanan masuk.</td></tr>';
          return;
        }

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const id = doc.id;
          
          // Simpan data asli ke array untuk keperluan ekspor
          semuaDataPesanan.push(data);

          const tanggal = data.tanggal ? data.tanggal.toDate().toLocaleDateString('id-ID') : '-';
          const hargaRupiah = 'Rp ' + data.totalHarga.toLocaleString('id-ID');
          const badgeClass = data.status === 'Pending' ? 'status-pending' : 'status-success';

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${tanggal}</td>
            <td>${data.nama}</td>
            <td>${data.email || '-'}</td>
            <td>${data.wa}</td>
            <td>${data.kelas}</td>
            <td>${hargaRupiah}</td>
            <td><span class="badge-status ${badgeClass}">${data.status}</span></td>
            <td>
              <a href="order-detail.html?id=${id}" class="btn btn-outline" style="padding: 5px 10px; font-size: 0.8rem; display: inline-block;">Detail</a>
            </td>
          `;
          tabelPesanan.appendChild(tr);
        });
      } catch (error) {
        console.error("Error: ", error);
        tabelPesanan.innerHTML = '<tr><td colspan="8" style="text-align:center; color: red;">Gagal memuat data.</td></tr>';
      }
    }

    tampilkanPesanan();

    // 2. Fungsi Ekspor ke CSV
    window.eksporCSV = function() {
      if (semuaDataPesanan.length === 0) {
        alert("Belum ada data pesanan untuk diekspor.");
        return;
      }

      // Header kolom di Excel
      const headers = ["Tanggal", "Nama", "Email", "WhatsApp", "Kelas", "Total Harga", "Status"];
      
      // Proses ubah data JSON ke format baris CSV
      const rows = semuaDataPesanan.map(data => {
        const tgl = data.tanggal ? data.tanggal.toDate().toLocaleDateString('id-ID') : '-';
        return [
          `"${tgl}"`,
          `"${data.nama}"`,
          `"${data.email || '-'}"`,
          `"${data.wa}"`,
          `"${data.kelas}"`,
          `"${data.totalHarga}"`,
          `"${data.status}"`
        ].join(","); // Gabungkan dengan koma
      });

      // Gabungkan header dan isi
      const csvContent = headers.join(",") + "\n" + rows.join("\n");
      
      // Buat file Blob dengan format UTF-8 (biar karakter Indonesia aman)
      const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
      
      // Buat link download tersembunyi
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.setAttribute("href", url);
      
      // Nama file otomatis pakai tanggal hari ini
      const today = new Date().toISOString().slice(0, 10);
      link.setAttribute("download", `Data_Pesanan_Selaras_${today}.csv`);
      
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    window.logout = function() {
      localStorage.removeItem('isAdminLoggedIn');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
