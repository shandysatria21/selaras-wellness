<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Pesanan - Admin</title>
  <link rel="stylesheet" href="admin-style.css">
  <script>
    if (localStorage.getItem('isAdminLoggedIn') !== 'true') {
      window.location.href = 'login.html';
    }
  </script>
</head>
<body>

  <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.add('active')">☰</button>

  <aside class="sidebar">
    <button class="close-menu" onclick="document.querySelector('.sidebar').classList.remove('active')">✕</button>
    <a href="dashboard.html" class="logo"><img src="../img/SELARAS.png" alt="Logo"></a>
    <div class="menu-group">
      <a href="dashboard.html" class="menu-item">Dashboard</a>
      <a href="classes.html" class="menu-item">Kelola Kelas</a>
      <a href="orders.html" class="menu-item active">Data Pesanan</a>
      <a href="gallery.html" class="menu-item">Kelola Galeri</a>
      <a href="messages.html" class="menu-item">Pesan Masuk</a>
      <a href="settings.html" class="menu-item">Pengaturan Web</a>
    </div>
    <div class="menu-group" style="margin-top: auto;">
      <a href="#" onclick="logout()" class="menu-item" style="color: #f87171;">Logout</a>
    </div>
  </aside>

  <main class="main-content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px;">
      <div>
        <h1 class="page-title">Data Pesanan</h1>
        <p class="page-subtitle" style="margin-bottom: 0;">Semua riwayat pemesanan kelas yoga.</p>
      </div>
      
      <!-- AREA FILTER & EKSPOR -->
      <div style="display: flex; gap: 10px; align-items: center;">
        <select id="filterKelas" class="form-control" style="width: auto; min-width: 200px;" onchange="filterTabel()">
          <option value="semua">Semua Kelas</option>
          <!-- Opsi kelas akan diisi via JS -->
        </select>
        <button id="btnEkspor" class="btn btn-primary" style="background-color: #10b981; border-color: #10b981;" onclick="eksporCSV()">
          ⬇️ Ekspor CSV
        </button>
      </div>
    </div>

    <div class="table-wrapper">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Nama</th>
            <th>Email</th>
            <th>WA</th>
            <th>Kelas</th>
            <th>Total</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelPesanan">
          <tr><td colspan="8" style="text-align:center;">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script type="module">
    import { firebaseConfig, app } from '../firebase-config.js';
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);
    const tabelPesanan = document.getElementById('tabelPesanan');
    const filterKelas = document.getElementById('filterKelas');
    
    let semuaDataPesanan = []; // Menyimpan semua data asli
    let dataTampil = [];       // Menyimpan data yang sedang difilter

    // 1. Ambil Data dari Database
    async function tampilkanPesanan() {
      try {
        const q = query(collection(db, "orders"), orderBy("tanggal", "desc"));
        const querySnapshot = await getDocs(q);
        
        semuaDataPesanan = []; 
        const daftarKelasUnik = new Set(); // Untuk nyimpen nama kelas unik
        
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          data.id = doc.id; // Simpan ID doc
          semuaDataPesanan.push(data);
          if (data.kelas) daftarKelasUnik.add(data.kelas);
        });

        // Isi Dropdown Filter dengan nama kelas unik
        daftarKelasUnik.forEach(kelas => {
          const option = document.createElement('option');
          option.value = kelas;
          option.innerText = kelas;
          filterKelas.appendChild(option);
        });

        // Tampilkan semua data awal
        renderTabel(semuaDataPesanan);

      } catch (error) {
        console.error("Error: ", error);
        tabelPesanan.innerHTML = '<tr><td colspan="8" style="text-align:center; color: red;">Gagal memuat data.</td></tr>';
      }
    }

    // 2. Fungsi Render Tabel (Bisa dipanggil ulang saat filter berubah)
    function renderTabel(dataArray) {
      tabelPesanan.innerHTML = '';
      dataTampil = dataArray; // Simpan data yang lagi tampil untuk diekspor
      
      if (dataArray.length === 0) {
        tabelPesanan.innerHTML = '<tr><td colspan="8" style="text-align:center;">Tidak ada pesanan untuk filter ini.</td></tr>';
        return;
      }

      dataArray.forEach((data) => {
        const tanggal = data.tanggal ? data.tanggal.toDate().toLocaleDateString('id-ID') : '-';
        const hargaRupiah = 'Rp ' + data.totalHarga.toLocaleString('id-ID');
        const badgeClass = data.status === 'Pending' ? 'status-pending' : 'status-success';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${tanggal}</td>
          <td>${data.nama}</td>
          <td>${data.email || '-'}</td>
          <td>${data.wa}</td>
          <td>${data.kelas}</td>
          <td>${hargaRupiah}</td>
          <td><span class="badge-status ${badgeClass}">${data.status}</span></td>
          <td>
            <a href="order-detail.html?id=${data.id}" class="btn btn-outline" style="padding: 5px 10px; font-size: 0.8rem; display: inline-block;">Detail</a>
          </td>
        `;
        tabelPesanan.appendChild(tr);
      });
    }

    // 3. Fungsi Filter Tabel
    window.filterTabel = function() {
      const pilihan = filterKelas.value;
      if (pilihan === 'semua') {
        renderTabel(semuaDataPesanan);
      } else {
        const dataFilter = semuaDataPesanan.filter(pesanan => pesanan.kelas === pilihan);
        renderTabel(dataFilter);
      }
    }

    // 4. Fungsi Ekspor CSV (Berdasarkan data yang sedang tampil/filter)
    window.eksporCSV = function() {
      if (dataTampil.length === 0) {
        alert("Tidak ada data untuk diekspor pada filter ini.");
        return;
      }

      const headers = ["Tanggal", "Nama", "Email", "WhatsApp", "Kelas", "Total Harga", "Status"];
      
      const rows = dataTampil.map(data => {
        const tgl = data.tanggal ? data.tanggal.toDate().toLocaleDateString('id-ID') : '-';
        return [
          `"${tgl}"`,
          `"${data.nama}"`,
          `"${data.email || '-'}"`,
          `"${data.wa}"`,
          `"${data.kelas}"`,
          `"${data.totalHarga}"`,
          `"${data.status}"`
        ].join(",");
      });

      const csvContent = headers.join(",") + "\n" + rows.join("\n");
      const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
      
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.setAttribute("href", url);
      
      // Nama file disesuaikan dengan filter yang dipilih
      const namaFile = filterKelas.value === 'semua' ? 'Semua_Pesanan' : filterKelas.value.replace(/\s+/g, '_');
      const today = new Date().toISOString().slice(0, 10);
      link.setAttribute("download", `Data_${namaFile}_${today}.csv`);
      
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    tampilkanPesanan();

    window.logout = function() {
      localStorage.removeItem('isAdminLoggedIn');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
