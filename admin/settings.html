<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengaturan Web - Admin</title>
  <link rel="stylesheet" href="admin-style.css">
  <style>
    /* Style Khusus untuk Tab Menu */
    .tab-menu {
      display: flex;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 25px;
      gap: 10px;
      overflow-x: auto; /* Biar bisa digeser kalau layar sempit */
    }
    .tab-btn {
      background: none;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: #0f172a; }
    .tab-btn.active {
      color: #3b82f6;
      border-bottom-color: #3b82f6;
    }
    .tab-content {
      display: none; /* Sembunyikan semua konten tab secara default */
      animation: fadeIn 0.3s ease;
    }
    .tab-content.active {
      display: block; /* Tampilkan hanya yang aktif */
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <script>
    if (localStorage.getItem('isAdminLoggedIn') !== 'true') { window.location.href = 'login.html'; }
  </script>
</head>
<body>

  <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.add('active')">☰</button>

  <aside class="sidebar">
    <button class="close-menu" onclick="document.querySelector('.sidebar').classList.remove('active')">✕</button>
    <a href="dashboard.html" class="logo"><img src="../img/SELARAS.png" alt="Logo"></a>
    <div class="menu-group">
      <a href="dashboard.html" class="menu-item">Dashboard</a>
      <a href="classes.html" class="menu-item">Kelola Kelas</a>
      <a href="orders.html" class="menu-item">Data Pesanan</a>
      <a href="gallery.html" class="menu-item">Kelola Galeri</a>
      <a href="messages.html" class="menu-item">Pesan Masuk</a>
      <a href="settings.html" class="menu-item active">Pengaturan Web</a>
    </div>
    <div class="menu-group" style="margin-top: auto;">
      <a href="#" onclick="logout()" class="menu-item" style="color: #f87171;">Logout</a>
    </div>
  </aside>

  <main class="main-content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
      <div>
        <h1 class="page-title">Pengaturan Website</h1>
        <p class="page-subtitle" style="margin-bottom: 0;">Ubah teks dan gambar yang tampil di halaman pengunjung.</p>
      </div>
    </div>

    <div class="table-wrapper" style="padding: 30px; max-width: 800px;">
      
      <!-- MENU TAB -->
      <div class="tab-menu">
        <button class="tab-btn active" onclick="openTab(event, 'tabHome')">Home</button>
        <button class="tab-btn" onclick="openTab(event, 'tabAbout')">About Us</button>
        <button class="tab-btn" onclick="openTab(event, 'tabContact')">Contact</button>
        <button class="tab-btn" onclick="openTab(event, 'tabLainnya')">Lainnya</button>
      </div>

      <form id="formPengaturan">
        
        <!-- TAB 1: HOME -->
        <div id="tabHome" class="tab-content active">
          <h3 style="margin-bottom: 15px; color: #0f172a;">Halaman Home</h3>
          <div class="form-group">
            <label>Judul Utama (Hero)</label>
            <input type="text" id="inpHomeJudul" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Sub-judul (Hero)</label>
            <textarea id="inpHomeSub" class="form-control" rows="2" required></textarea>
          </div>
          <div class="form-group">
            <label>Gambar Hero Saat Ini:</label>
            <img id="previewHome" src="" alt="Gambar Home" style="width: 150px; height: 100px; object-fit: cover; border-radius: 8px; margin-top: 10px; border: 1px solid #e2e8f0; display: block;">
          </div>
          <div class="form-group">
            <label>Ganti Gambar Hero (Kosongkan jika tidak diganti)</label>
            <input type="file" id="inpHomeGambar" class="form-control" accept="image/*" style="background: #fff;">
          </div>
        </div>

        <!-- TAB 2: ABOUT US -->
        <div id="tabAbout" class="tab-content">
          <h3 style="margin-bottom: 15px; color: #0f172a;">Halaman About Us</h3>
          <div class="form-group">
            <label>Judul About</label>
            <input type="text" id="inpAboutJudul" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Deskripsi About</label>
            <textarea id="inpAboutDesc" class="form-control" rows="4" required></textarea>
          </div>
          <div class="form-group">
            <label>Quote</label>
            <textarea id="inpAboutQuote" class="form-control" rows="2" required></textarea>
          </div>
          <div class="form-group">
            <label>Gambar About Saat Ini:</label>
            <img id="previewAbout" src="" alt="Gambar About" style="width: 150px; height: 100px; object-fit: cover; border-radius: 8px; margin-top: 10px; border: 1px solid #e2e8f0; display: block;">
          </div>
          <div class="form-group">
            <label>Ganti Gambar About (Kosongkan jika tidak diganti)</label>
            <input type="file" id="inpAboutGambar" class="form-control" accept="image/*" style="background: #fff;">
          </div>

          <!-- Filosofi -->
          <hr style="margin: 20px 0; border: 0; border-top: 1px solid #e2e8f0;">
          <h3 style="margin-bottom: 15px; color: #0f172a;">Filosofi Kami</h3>
          
          <div style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 15px;">
            <div class="form-group"><label>Filosofi 1 (Ikon, Judul)</label><input type="text" id="inpFilosofi1Judul" class="form-control" placeholder="🧘‍♀️, Mindfulness" required></div>
            <div class="form-group" style="margin-bottom: 0;"><label>Deskripsi</label><textarea id="inpFilosofi1Desc" class="form-control" rows="2" required></textarea></div>
          </div>
          <div style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 15px;">
            <div class="form-group"><label>Filosofi 2 (Ikon, Judul)</label><input type="text" id="inpFilosofi2Judul" class="form-control" placeholder="🌿, Keseimbangan" required></div>
            <div class="form-group" style="margin-bottom: 0;"><label>Deskripsi</label><textarea id="inpFilosofi2Desc" class="form-control" rows="2" required></textarea></div>
          </div>
          <div style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 15px;">
            <div class="form-group"><label>Filosofi 3 (Ikon, Judul)</label><input type="text" id="inpFilosofi3Judul" class="form-control" placeholder="🤝, Komunitas" required></div>
            <div class="form-group" style="margin-bottom: 0;"><label>Deskripsi</label><textarea id="inpFilosofi3Desc" class="form-control" rows="2" required></textarea></div>
          </div>
        </div>

        <!-- TAB 3: CONTACT -->
        <div id="tabContact" class="tab-content">
          <h3 style="margin-bottom: 15px; color: #0f172a;">Halaman Contact</h3>
          <div class="form-group">
            <label>Alamat Studio</label>
            <input type="text" id="inpContactAlamat" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Nomor Telepon / WA</label>
            <input type="text" id="inpContactWa" class="form-control" required>
          </div>
        </div>

        <!-- TAB 4: LAINNYA -->
        <div id="tabLainnya" class="tab-content">
          <h3 style="margin-bottom: 15px; color: #0f172a;">Lainnya</h3>
          <div class="form-group">
            <label>Wording Halaman Sukses</label>
            <textarea id="inpWordingSuccess" class="form-control" rows="3" required></textarea>
          </div>
          <div class="form-group">
            <label>Link Grup WhatsApp</label>
            <input type="url" id="inpLinkWa" class="form-control" required>
          </div>
        </div>

        <!-- TOMBOL SIMPAN (Selalu muncul di bawah) -->
        <button type="submit" id="btnSimpan" class="btn btn-primary" style="width: 100%; margin-top: 30px;">Simpan Semua Pengaturan</button>
      </form>
    </div>
  </main>

  <script type="module">
    import { firebaseConfig, app } from '../firebase-config.js';
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);
    const docRef = doc(db, "pengaturan", "data-web"); 

    const form = document.getElementById('formPengaturan');
    const btnSimpan = document.getElementById('btnSimpan');
    const previewHome = document.getElementById('previewHome');
    const previewAbout = document.getElementById('previewAbout');

    // Fungsi untuk ganti Tab
    window.openTab = function(evt, tabName) {
      const tabContents = document.getElementsByClassName("tab-content");
      for (let i = 0; i < tabContents.length; i++) {
        tabContents[i].classList.remove("active");
      }
      const tabBtns = document.getElementsByClassName("tab-btn");
      for (let i = 0; i < tabBtns.length; i++) {
        tabBtns[i].classList.remove("active");
      }
      document.getElementById(tabName).classList.add("active");
      evt.currentTarget.classList.add("active");
    }

    // 1. Load Data
    async function loadPengaturan() {
      try {
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          
          // Home
          document.getElementById('inpHomeJudul').value = data.homeJudul || '';
          document.getElementById('inpHomeSub').value = data.homeSub || '';
          if (data.homeGambar) previewHome.src = data.homeGambar;
          
          // About
          document.getElementById('inpAboutJudul').value = data.aboutJudul || '';
          document.getElementById('inpAboutDesc').value = data.aboutDesc || '';
          document.getElementById('inpAboutQuote').value = data.aboutQuote || '';
          if (data.aboutGambar) previewAbout.src = data.aboutGambar;

          // Filosofi
          document.getElementById('inpFilosofi1Judul').value = data.filosofi1Judul || "🧘‍♀️, Mindfulness";
          document.getElementById('inpFilosofi1Desc').value = data.filosofi1Desc || "Kami mengajakmu untuk hadir sepenuhnya di momen ini...";
          document.getElementById('inpFilosofi2Judul').value = data.filosofi2Judul || "🌿, Keseimbangan";
          document.getElementById('inpFilosofi2Desc').value = data.filosofi2Desc || "Menemukan titik temu antara kekuatan dan kelembutan...";
          document.getElementById('inpFilosofi3Judul').value = data.filosofi3Judul || "🤝, Komunitas";
          document.getElementById('inpFilosofi3Desc').value = data.filosofi3Desc || "Kami tumbuh bersama...";

          // Contact
          document.getElementById('inpContactAlamat').value = data.contactAlamat || '';
          document.getElementById('inpContactWa').value = data.contactWa || '';
          
          // Lainnya
          document.getElementById('inpWordingSuccess').value = data.wordingSuccess || '';
          document.getElementById('inpLinkWa').value = data.linkWa || '';
        }
      } catch (error) {
        console.error("Gagal load pengaturan: ", error);
      }
    }

    loadPengaturan();

    // 2. Simpan Data
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnSimpan.innerText = 'Menyimpan...';
      btnSimpan.disabled = true;

      try {
        let homeImageUrl = null;
        let aboutImageUrl = null;

        const cloudName = 'd4cltmgp'; // GANTI DENGAN CLOUD NAME KAMU
        const uploadPreset = 'selaras_bukti';

        const fileHome = document.getElementById('inpHomeGambar').files[0];
        const fileAbout = document.getElementById('inpAboutGambar').files[0];

        if (fileHome) {
          const formDataHome = new FormData();
          formDataHome.append('file', fileHome);
          formDataHome.append('upload_preset', uploadPreset);
          const resHome = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, { method: 'POST', body: formDataHome });
          const dataHome = await resHome.json();
          homeImageUrl = dataHome.secure_url;
        }

        if (fileAbout) {
          const formDataAbout = new FormData();
          formDataAbout.append('file', fileAbout);
          formDataAbout.append('upload_preset', uploadPreset);
          const resAbout = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, { method: 'POST', body: formDataAbout });
          const dataAbout = await resAbout.json();
          aboutImageUrl = dataAbout.secure_url;
        }

        const updateData = {
          homeJudul: document.getElementById('inpHomeJudul').value,
          homeSub: document.getElementById('inpHomeSub').value,
          aboutJudul: document.getElementById('inpAboutJudul').value,
          aboutDesc: document.getElementById('inpAboutDesc').value,
          aboutQuote: document.getElementById('inpAboutQuote').value,
          filosofi1Judul: document.getElementById('inpFilosofi1Judul').value,
          filosofi1Desc: document.getElementById('inpFilosofi1Desc').value,
          filosofi2Judul: document.getElementById('inpFilosofi2Judul').value,
          filosofi2Desc: document.getElementById('inpFilosofi2Desc').value,
          filosofi3Judul: document.getElementById('inpFilosofi3Judul').value,
          filosofi3Desc: document.getElementById('inpFilosofi3Desc').value,
          contactAlamat: document.getElementById('inpContactAlamat').value,
          contactWa: document.getElementById('inpContactWa').value,
          wordingSuccess: document.getElementById('inpWordingSuccess').value,
          linkWa: document.getElementById('inpLinkWa').value
        };

        if (homeImageUrl) updateData.homeGambar = homeImageUrl;
        if (aboutImageUrl) updateData.aboutGambar = aboutImageUrl;

        await setDoc(docRef, updateData, { merge: true });

        alert('Pengaturan berhasil disimpan!');
        window.location.reload();
      } catch (error) {
        console.error("Gagal simpan: ", error);
        alert('Gagal menyimpan pengaturan.');
      } finally {
        btnSimpan.innerText = 'Simpan Semua Pengaturan';
        btnSimpan.disabled = false;
      }
    });

    window.logout = function() {
      localStorage.removeItem('isAdminLoggedIn');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
