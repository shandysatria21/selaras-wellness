<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Galeri - Admin</title>
  <link rel="stylesheet" href="admin-style.css">
  <style>
    .admin-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
    .gallery-item { background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; position: relative; }
    .gallery-item img { width: 100%; height: 150px; object-fit: cover; }
    .gallery-item .delete-btn { position: absolute; top: 10px; right: 10px; background: #ef4444; color: #fff; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    .upload-box { background: #fff; padding: 25px; border-radius: 12px; border: 1px dashed #3b82f6; margin-bottom: 30px; text-align: center; }
  </style>
  <script>
    if (localStorage.getItem('isAdminLoggedIn') !== 'true') { window.location.href = 'login.html'; }
  </script>
</head>
<body>

  <aside class="sidebar">
    <a href="dashboard.html" class="logo">ADMIN PANEL</a>
    <div class="menu-group">
      <a href="dashboard.html" class="menu-item">Dashboard</a>
      <a href="classes.html" class="menu-item">Kelola Kelas</a>
      <a href="orders.html" class="menu-item">Data Pesanan</a>
      <a href="gallery.html" class="menu-item active">Kelola Galeri</a>
      <a href="messages.html" class="menu-item">Pesan Masuk</a>
      <a href="settings.html" class="menu-item">Pengaturan Web</a>
    </div>
    <div class="menu-group" style="margin-top: auto;">
      <a href="#" onclick="logout()" class="menu-item" style="color: #f87171;">Logout</a>
    </div>
  </aside>

  <main class="main-content">
    <h1 class="page-title">Kelola Galeri</h1>
    <p class="page-subtitle">Upload dan hapus foto yang tampil di halaman Galeri pengunjung.</p>

    <!-- Form Upload Foto Baru -->
    <div class="upload-box">
      <h3 style="margin-bottom: 15px; font-size: 1.1rem;">Upload Foto Baru</h3>
      <form id="formUploadGaleri">
        <input type="file" id="inpGambarGaleri" accept="image/*" required style="margin-bottom: 15px;">
        <br>
        <button type="submit" id="btnUpload" class="btn btn-primary">Upload Gambar</button>
      </form>
    </div>

    <!-- Daftar Foto Existing -->
    <h3 style="margin-bottom: 10px;">Foto Saat Ini</h3>
    <div class="admin-gallery" id="galeriContainer">
      <p style="text-align: center; width: 100%;">Memuat data...</p>
    </div>
  </main>

  <script type="module">
    import { firebaseConfig, app } from '../firebase-config.js';
    import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);
    const galeriContainer = document.getElementById('galeriContainer');
    const form = document.getElementById('formUploadGaleri');
    const btnUpload = document.getElementById('btnUpload');

    // 1. Tampilkan Galeri dari Database
    async function loadGaleri() {
      try {
        const querySnapshot = await getDocs(collection(db, "galeri"));
        galeriContainer.innerHTML = '';

        if (querySnapshot.empty) {
          galeriContainer.innerHTML = '<p style="text-align: center; width: 100%;">Belum ada foto di galeri.</p>';
          return;
        }

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const id = doc.id;

          const div = document.createElement('div');
          div.className = 'gallery-item';
          div.innerHTML = `
            <img src="${data.url}" alt="Galeri">
            <button class="delete-btn" onclick="hapusFoto('${id}')">Hapus</button>
          `;
          galeriContainer.appendChild(div);
        });
      } catch (error) {
        console.error("Error load galeri: ", error);
        galeriContainer.innerHTML = '<p style="color: red;">Gagal memuat galeri.</p>';
      }
    }

    loadGaleri();

    // 2. Proses Upload
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnUpload.innerText = 'Mengunggah...';
      btnUpload.disabled = true;

      try {
        const fileGambar = document.getElementById('inpGambarGaleri').files[0];
        
        // Konfigurasi Cloudinary
        const cloudName = 'd4cltmgp'; // GANTI DENGAN CLOUD NAME KAMU
        const uploadPreset = 'selaras_bukti'; // GANTI DENGAN PRESET KAMU

        const formData = new FormData();
        formData.append('file', fileGambar);
        formData.append('upload_preset', uploadPreset);

        const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
          method: 'POST',
          body: formData
        });

        const cloudinaryData = await response.json();
        const imageUrl = cloudinaryData.secure_url;

        // Simpan ke Firestore koleksi "galeri"
        await addDoc(collection(db, "galeri"), {
          url: imageUrl,
          tanggal: new Date()
        });

        alert('Foto berhasil ditambahkan!');
        form.reset();
        loadGaleri(); // Refresh tampilan galeri admin
        
      } catch (error) {
        console.error("Error upload: ", error);
        alert('Gagal mengunggah foto.');
      } finally {
        btnUpload.innerText = 'Upload Gambar';
        btnUpload.disabled = false;
      }
    });

    // 3. Proses Hapus
    window.hapusFoto = async function(id) {
      const konfirmasi = confirm("Yakin ingin menghapus foto ini?");
      if (!konfirmasi) return;

      try {
        await deleteDoc(doc(db, "galeri", id));
        alert('Foto berhasil dihapus!');
        loadGaleri(); // Refresh
      } catch (error) {
        console.error("Error hapus: ", error);
        alert('Gagal menghapus foto.');
      }
    }

    window.logout = function() {
      localStorage.removeItem('isAdminLoggedIn');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
