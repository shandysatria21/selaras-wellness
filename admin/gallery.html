<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Galeri - Admin</title>
  <link rel="stylesheet" href="admin-style.css">
  <style>
    /* Grid untuk Galeri */
    .admin-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .gallery-item {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      position: relative;
    }
    .gallery-item img {
      width: 100%; height: 150px; object-fit: cover;
    }
    .gallery-item .delete-btn {
      position: absolute; top: 10px; right: 10px;
      background: #ef4444; color: #fff; border: none;
      padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem;
    }
    .upload-box {
      background: #fff; padding: 25px; border-radius: 12px;
      border: 1px dashed #3b82f6; margin-bottom: 30px; text-align: center;
    }
  </style>
  <script>
    if (localStorage.getItem('isAdminLoggedIn') !== 'true') {
      window.location.href = 'login.html';
    }
  </script>
</head>
<body>

  <aside class="sidebar">
    <a href="dashboard.html" class="logo">ADMIN PANEL</a>
    <div class="menu-group">
      <a href="dashboard.html" class="menu-item">Dashboard</a>
      <a href="classes.html" class="menu-item">Kelola Kelas</a>
      <a href="orders.html" class="menu-item">Data Pesanan</a>
      <a href="gallery.html" class="menu-item active">Kelola Galeri</a>
      <a href="settings.html" class="menu-item">Pengaturan Web</a>
    </div>
    <div class="menu-group" style="margin-top: auto;">
      <a href="#" onclick="logout()" class="menu-item" style="color: #f87171;">Logout</a>
    </div>
  </aside>

  <main class="main-content">
    <h1 class="page-title">Kelola Galeri</h1>
    <p class="page-subtitle">Upload dan hapus foto yang tampil di halaman Galeri pengunjung.</p>

    <!-- Form Upload Foto Baru -->
    <div class="upload-box">
      <h3 style="margin-bottom: 15px; font-size: 1.1rem;">Upload Foto Baru</h3>
      <form onsubmit="event.preventDefault(); alert('Foto berhasil diupload! (Simulasi)');">
        <input type="file" accept="image/*" required style="margin-bottom: 15px;">
        <br>
        <button type="submit" class="btn btn-primary">Upload Gambar</button>
      </form>
    </div>

    <!-- Daftar Foto Existing -->
    <h3 style="margin-bottom: 10px;">Foto Saat Ini</h3>
    <div class="admin-gallery">
      <!-- Foto 1 -->
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&w=300&q=80" alt="Galeri 1">
        <button class="delete-btn" onclick="alert('Hapus foto ini?')">Hapus</button>
      </div>
      <!-- Foto 2 -->
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=300&q=80" alt="Galeri 2">
        <button class="delete-btn" onclick="alert('Hapus foto ini?')">Hapus</button>
      </div>
      <!-- Foto 3 -->
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1599901860904-17e6ed7083a0?auto=format&fit=crop&w=300&q=80" alt="Galeri 3">
        <button class="delete-btn" onclick="alert('Hapus foto ini?')">Hapus</button>
      </div>
    </div>
  </main>

  <script>
    function logout() {
      localStorage.removeItem('isAdminLoggedIn');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
