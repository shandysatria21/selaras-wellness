<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Selaras</title>
  <link rel="stylesheet" href="admin-style.css">
</head>
<body class="login-body">

  <div class="login-container">
    <a href="../index.html" class="login-logo">SELARAS.</a>
    <p style="text-align: center; color: #64748b; margin-bottom: 30px;">Masuk ke Panel Admin</p>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email Admin</label>
        <input type="email" class="form-control" placeholder="admin@selaras.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
      </div>
      
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Login</button>
      <p id="errorMsg" style="color: #ef4444; font-size: 0.9rem; text-align: center; margin-top: 15px; display: none;">Password salah! (Hint: admin123)</p>
    </form>
    
    <div style="text-align: center; margin-top: 20px;">
      <a href="../index.html" style="color: #64748b; font-size: 0.9rem; text-decoration: none;">&larr; Kembali ke Website</a>
    </div>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const pass = document.getElementById('password').value;
      
      if (pass === 'admin123') {
        localStorage.setItem('isAdminLoggedIn', 'true');
        window.location.href = 'dashboard.html';
      } else {
        document.getElementById('errorMsg').style.display = 'block';
      }
    }
  </script>

</body>
</html>
