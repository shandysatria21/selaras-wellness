<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Kelas - Admin</title>
  <link rel="stylesheet" href="admin-style.css">
  <script>
    if (localStorage.getItem('isAdminLoggedIn') !== 'true') { window.location.href = 'login.html'; }
  </script>
</head>
<body>
<button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.add('active')">☰</button>
  <aside class="sidebar">
    <button class="close-menu" onclick="document.querySelector('.sidebar').classList.remove('active')">✕</button>
    <a href="dashboard.html" class="logo"><img src="../img/SELARAS.png" alt="Logo"></a>
    <div class="menu-group">
      <a href="dashboard.html" class="menu-item">Dashboard</a>
      <a href="classes.html" class="menu-item active">Kelola Kelas</a>
      <a href="orders.html" class="menu-item">Data Pesanan</a>
      <a href="gallery.html" class="menu-item">Kelola Galeri</a>
      <a href="messages.html" class="menu-item">Pesan Masuk</a>
      <a href="settings.html" class="menu-item">Pengaturan Web</a>
    </div>
    <div class="menu-group" style="margin-top: auto;">
      <a href="#" onclick="logout()" class="menu-item" style="color: #f87171;">Logout</a>
    </div>
  </aside>

  <main class="main-content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
      <div>
        <h1 class="page-title">Tambah Kelas Baru</h1>
        <p class="page-subtitle" style="margin-bottom: 0;">Lengkapi jadwal kelas yoga.</p>
      </div>
      <a href="classes.html" class="btn btn-outline">Kembali</a>
    </div>

    <div class="table-wrapper" style="padding: 30px; max-width: 700px;">
      <form id="formTambahKelas">
        
        <div class="form-group">
          <label>Nama Kelas *</label>
          <input type="text" id="nama" class="form-control" placeholder="Contoh: Sunrise Yoga" required>
        </div>

        <div class="form-group">
          <label>Nama Coach *</label>
          <input type="text" id="coach" class="form-control" placeholder="Contoh: Kak Sarah" required>
        </div>

        <div class="form-group">
          <label>Tanggal Kelas *</label>
          <input type="date" id="tanggal" class="form-control" required>
        </div>

        <div class="form-group">
          <label>Lokasi *</label>
          <input type="text" id="lokasi" class="form-control" placeholder="Contoh: Studio Utama / Zoom" required>
        </div>

        <div style="display: flex; gap: 20px;">
          <div class="form-group" style="flex: 1;">
            <label>Harga (Rp) *</label>
            <input type="number" id="harga" class="form-control" placeholder="115000" required>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Kuota (Orang) *</label>
            <input type="number" id="kuota" class="form-control" placeholder="20" required>
          </div>
        </div>

        <div class="form-group">
          <label>Upload Gambar Kelas *</label>
          <input type="file" id="gambar" class="form-control" accept="image/*" required style="background: #fff;">
        </div>

        <div class="form-group">
          <label>Deskripsi Singkat</label>
          <textarea id="deskripsi" class="form-control" rows="3"></textarea>
        </div>

        <button type="submit" id="btnSimpan" class="btn btn-primary" style="width: 100%; margin-top: 20px;">Simpan Kelas</button>
      </form>
    </div>
  </main>

  <script type="module">
    import { firebaseConfig, app } from '../firebase-config.js';
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);
    const form = document.getElementById('formTambahKelas');
    const btnSimpan = document.getElementById('btnSimpan');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnSimpan.innerText = 'Mengunggah...';
      btnSimpan.disabled = true;

      try {
        const fileGambar = document.getElementById('gambar').files[0];
        if (!fileGambar) { alert("Pilih gambar dulu!"); return; }

        const cloudName = 'd4cltmgp'; // GANTI DENGAN CLOUD NAME KAMU
        const uploadPreset = 'selaras_bukti';

        const formData = new FormData();
        formData.append('file', fileGambar);
        formData.append('upload_preset', uploadPreset);

        const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
          method: 'POST',
          body: formData
        });

        const cloudinaryData = await response.json();
        const imageUrl = cloudinaryData.secure_url;

        btnSimpan.innerText = 'Menyimpan data...';

        await addDoc(collection(db, "classes"), {
          nama: document.getElementById('nama').value,
          coach: document.getElementById('coach').value,
          tanggal: document.getElementById('tanggal').value,
          lokasi: document.getElementById('lokasi').value,
          harga: parseInt(document.getElementById('harga').value),
          kuotaAwal: parseInt(document.getElementById('kuota').value),
          kuotaTersisa: parseInt(document.getElementById('kuota').value),
          gambar: imageUrl,
          deskripsi: document.getElementById('deskripsi').value,
          statusAktif: true,
          createdAt: new Date()
        });

        alert('Kelas berhasil ditambahkan!');
        window.location.href = 'classes.html';
      } catch (error) {
        console.error("Error: ", error);
        alert('Gagal menyimpan data.');
      } finally {
        btnSimpan.innerText = 'Simpan Kelas';
        btnSimpan.disabled = false;
      }
    });

    window.logout = function() {
      localStorage.removeItem('isAdminLoggedIn');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
