<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Kelas - Admin</title>
  <link rel="stylesheet" href="admin-style.css">
  <script>
    if (localStorage.getItem('isAdminLoggedIn') !== 'true') { window.location.href = 'login.html'; }
  </script>
</head>
<body>

  <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.add('active')">☰</button>

  <aside class="sidebar">
    <button class="close-menu" onclick="document.querySelector('.sidebar').classList.remove('active')">✕</button>
    <a href="dashboard.html" class="logo"><img src="../img/SELARAS.png" alt="Logo"></a>
    <div class="menu-group">
      <a href="dashboard.html" class="menu-item">Dashboard</a>
      <a href="classes.html" class="menu-item active">Kelola Event</a>
      <a href="orders.html" class="menu-item">Data Pesanan</a>
      <a href="gallery.html" class="menu-item">Kelola Galeri</a>
      <a href="partners.html" class="menu-item">Kelola Partner</a>
      <a href="messages.html" class="menu-item">Pesan Masuk</a>
      <a href="settings.html" class="menu-item">Pengaturan Web</a>
    </div>
    <div class="menu-group" style="margin-top: auto;">
      <a href="#" onclick="logout()" class="menu-item" style="color: #f87171;">Logout</a>
    </div>
  </aside>

  <main class="main-content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
      <div>
        <h1 class="page-title">Tambah Kelas Baru</h1>
        <p class="page-subtitle" style="margin-bottom: 0;">Lengkapi jadwal kelas yoga.</p>
      </div>
      <a href="classes.html" class="btn btn-outline">Kembali</a>
    </div>

    <div class="table-wrapper" style="padding: 30px; max-width: 700px;">
      <form id="formTambahKelas">
        
        <div class="form-group">
          <label>Nama Kelas *</label>
          <input type="text" id="nama" class="form-control" placeholder="Contoh: Sunrise Yoga" required>
        </div>

        <div class="form-group">
          <label>Kategori Event *</label>
          <select id="kategori" class="form-control" required>
            <option value="Yoga">Yoga</option>
            <option value="Pilates">Pilates</option>
            <option value="Sound Healing">Sound Healing</option>
            <option value="Art & Craft">Art & Craft</option>
            <option value="Retreat">Retreat</option>
            <option value="Journaling">Journaling</option>
          </select>
        </div>

        <div class="form-group">
          <label>Nama Coach *</label>
          <input type="text" id="coach" class="form-control" placeholder="Contoh: Kak Sarah" required>
        </div>

        <div style="display: flex; gap: 20px;">
          <div class="form-group" style="flex: 1;">
            <label>Tanggal Kelas *</label>
            <input type="date" id="tanggal" class="form-control" required>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Jam Kelas *</label>
            <input type="time" id="jam" class="form-control" required>
          </div>
        </div>

        <div class="form-group">
          <label>Lokasi *</label>
          <input type="text" id="lokasi" class="form-control" placeholder="Contoh: Studio Utama / Zoom" required>
        </div>

        <div style="display: flex; gap: 20px;">
          <div class="form-group" style="flex: 1;">
            <label>Harga Satuan (Rp) *</label>
            <input type="number" id="harga" class="form-control" placeholder="78000" required>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Harga Bundling (Rp) *</label>
            <input type="number" id="hargaBundling" class="form-control" placeholder="140000" required>
            <small style="font-size: 0.75rem; color: #64748b;">Harga untuk 2 orang</small>
          </div>
        </div>

        <div class="form-group">
          <label>Kuota (Orang) *</label>
          <input type="number" id="kuota" class="form-control" placeholder="20" required>
        </div>

        <div style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
          <h4 style="margin-bottom: 10px; font-size: 0.95rem; color: #0f172a;">Promo (Opsional)</h4>
          <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <div class="form-group" style="flex: 1; min-width: 150px;">
              <label>Kode Promo</label>
              <input type="text" id="kodePromo" class="form-control" placeholder="Contoh: SEPI50">
            </div>
            <div class="form-group" style="flex: 1; min-width: 100px;">
              <label>Diskon (%)</label>
              <input type="number" id="diskonPromo" class="form-control" placeholder="50" min="0" max="100">
            </div>
            <div class="form-group" style="flex: 1; min-width: 100px;">
              <label>Kuota (Orang)</label>
              <input type="number" id="kuotaPromo" class="form-control" placeholder="5">
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Upload Gambar Kelas * (Bisa pilih lebih dari 1)</label>
          <input type="file" id="gambar" class="form-control" accept="image/*" multiple required style="background: #fff;">
          <small style="font-size: 0.75rem; color: #64748b;">Pilih maksimal 5 foto. Foto pertama akan jadi thumbnail utama.</small>
        </div>

        <div id="previewGambarBaru" style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;"></div>
        </div>

        <div class="form-group">
          <label>Deskripsi Singkat</label>
          <textarea id="deskripsi" class="form-control" rows="3"></textarea>
        </div>

        <button type="submit" id="btnSimpan" class="btn btn-primary" style="width: 100%; margin-top: 20px;">Simpan Kelas</button>
      </form>
    </div>
  </main>

  <script type="module">
    import { firebaseConfig, app } from '../firebase-config.js';
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);
    const form = document.getElementById('formTambahKelas');
    const btnSimpan = document.getElementById('btnSimpan');

        // LOGIKA PREVIEW GAMBAR SAAT DIPILIH
    document.getElementById('gambar').addEventListener('change', function(event) {
      const previewContainer = document.getElementById('previewGambarBaru');
      previewContainer.innerHTML = ''; // Bersihin preview sebelumnya
      
      const files = event.target.files;
      
      if (files.length > 0) {
        // Batasi maksimal 5 foto aja (opsional)
        if (files.length > 5) {
          alert("Maksimal 5 foto ya bro!");
          this.value = ""; // Reset input
          return;
        }

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          
          // Bikin URL sementara dari file lokal
          const imageUrl = URL.createObjectURL(file);
          
          const img = document.createElement('img');
          img.src = imageUrl;
          img.className = 'img-preview'; // Pakai class yang sama biar ukurannya rapi
          previewContainer.appendChild(img);
        }
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnSimpan.innerText = 'Mengunggah gambar...';
      btnSimpan.disabled = true;

      try {
        const files = document.getElementById('gambar').files;
        if (files.length === 0) { alert("Pilih gambar dulu!"); return; }

        const cloudName = 'd4cltmgp'; // CLOUD NAME KAMU
        const uploadPreset = 'selaras_bukti';
        let imageUrls = [];

        // Looping untuk upload semua gambar yang dipilih
        for (let i = 0; i < files.length; i++) {
          const formData = new FormData();
          formData.append('file', files[i]);
          formData.append('upload_preset', uploadPreset);

          const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
            method: 'POST',
            body: formData
          });

          const cloudinaryData = await response.json();
          imageUrls.push(cloudinaryData.secure_url);
        }

        btnSimpan.innerText = 'Menyimpan data...';

        await addDoc(collection(db, "classes"), {
          adminKey: 'SELARAS_ADMIN_2026',
          nama: document.getElementById('nama').value,
          kategori: document.getElementById('kategori').value,
          coach: document.getElementById('coach').value,
          tanggal: document.getElementById('tanggal').value,
          jam: document.getElementById('jam').value,
          lokasi: document.getElementById('lokasi').value,
          harga: parseInt(document.getElementById('harga').value),
          hargaBundling: parseInt(document.getElementById('hargaBundling').value),
          kuotaAwal: parseInt(document.getElementById('kuota').value),
          kuotaTersisa: parseInt(document.getElementById('kuota').value),
          kodePromo: document.getElementById('kodePromo').value.trim().toUpperCase(),
          diskonPromo: parseInt(document.getElementById('diskonPromo').value) || 0,
          kuotaPromo: parseInt(document.getElementById('kuotaPromo').value) || 0,
          
          gambar: imageUrls[0], // Gambar pertama untuk card
          gambarArray: imageUrls, // Semua gambar untuk slider
          
          deskripsi: document.getElementById('deskripsi').value,
          statusAktif: true,
          createdAt: new Date()
        });

        alert('Kelas berhasil ditambahkan!');
        window.location.href = 'classes.html';
      } catch (error) {
        console.error("Error: ", error);
        alert('Gagal menyimpan data.');
      } finally {
        btnSimpan.innerText = 'Simpan Kelas';
        btnSimpan.disabled = false;
      }
    });

    window.logout = function() {
      localStorage.removeItem('isAdminLoggedIn');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
