  <!-- KONTEN HOME -->
  <main class="main-content">
    <section class="hero">
      <div class="hero-text">
        <div class="badge">
          <span class="badge-dot"></span>
          <span class="badge-text">WELCOME</span> Yoga Fest 2026
        </div>
        
        <!-- Teks ini akan diisi oleh JavaScript -->
        <h1 id="heroJudul">Memuat...</h1>
        <p id="heroSub">Memuat...</p>
        
        <div class="btn-group">
          <a href="classes.html" class="btn btn-primary">Book Your Class</a>
          <a href="classes.html" class="btn btn-outline">View Schedule</a>
        </div>
      </div>
      <div class="hero-image" id="heroGambar" style="background-image: url('https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&w=1000&q=80');"></div>
    </section>
  </main>

  <script type="module">
    import { firebaseConfig, app } from './firebase-config.js';
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);
    const heroJudul = document.getElementById('heroJudul');
    const heroSub = document.getElementById('heroSub');

    async function loadHomeText() {
      try {
        const docRef = doc(db, "pengaturan", "data-web");
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          heroJudul.innerHTML = data.homeJudul || "Find Balance<br>Through Yoga";
          heroSub.innerText = data.homeSub || "A minimalist, calming space for mindful movement.";
        } else {
          // Jika database kosong, pakai teks default
          heroJudul.innerHTML = "Find Balance<br>Through Yoga";
          heroSub.innerText = "A minimalist, calming space for mindful movement.";
        }
      } catch (error) {
        console.error("Error load text: ", error);
        heroJudul.innerText = "Find Balance Through Yoga";
        heroSub.innerText = "A minimalist, calming space for mindful movement.";
      }
              if (docSnap.exists()) {
          const data = docSnap.data();
          heroJudul.innerHTML = data.homeJudul || "Find Balance<br>Through Yoga";
          heroSub.innerText = data.homeSub || "A minimalist, calming space for mindful movement.";
          
          // TAMBAHKAN BARIS INI UNTUK GANTI GAMBAR HERO
          if (data.homeGambar) {
            document.getElementById('heroGambar').style.backgroundImage = `url('${data.homeGambar}')`;
          }
        }
    }

    loadHomeText();
  </script>

</body>
