<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halaman Tidak Ditemukan - Selaras Wellness Club</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Style Khusus Halaman 404 */
    .error-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
      text-align: center;
      padding: 20px;
    }
    
    .error-image {
      width: 100%;
      max-width: 280px;
      height: auto;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite; /* Animasi ngambang */
    }

    .error-code {
      font-size: 5rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 10px;
      letter-spacing: -2px;
    }

    .error-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 15px;
    }

    .error-desc {
      font-size: 1.05rem;
      color: var(--text-muted);
      max-width: 500px;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }
  </style>
</head>
<body>

  <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.add('active')">☰</button>

  <aside class="sidebar">
    <button class="close-menu" onclick="document.querySelector('.sidebar').classList.remove('active')">✕</button>
    <a href="index.html" class="logo"><img src="img/SELARAS.png" alt="Logo"></a>
    <div class="menu-group">
      <a href="index.html" class="menu-item">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Home
      </a>
      <a href="classes.html" class="menu-item">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        Classes
      </a>
      <a href="galeri.html" class="menu-item">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        Galeri
      </a>
    
      <a href="about.html" class="menu-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        About Us
      </a>
    </div>

    <div class="menu-group">
      <a href="contact.html" class="menu-item">
        <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        Contact
      </a>
    </div>
  </aside>

  <main class="main-content">
    <div class="error-container">
      <!-- Panggil gambar 404 yang ada di folder img -->
      <img src="img/404.png" alt="Yoga Tersesat" class="error-image">
      
      <div class="error-code">404</div>
      <h1 class="error-title">Ups, Kamu Tersesat!</h1>
      <p class="error-desc">Halaman yang kamu cari mungkin sudah dipindahkan, dihapus, atau tidak pernah ada. Yuk, tarik napas dalam-dalam dan kembali ke jalur yang benar.</p>
      
      <a href="index.html" class="btn btn-primary" style="padding: 15px 40px; font-size: 1.1rem;">Kembali ke Home</a>
    </div>
  </main>

</body>
</html>
