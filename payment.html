<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - Selaras Wellness Club</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <style>
    .payment-box { max-width: 550px; }
    .form-label { font-weight: 500; margin-bottom: 8px; display: block; font-size: 1rem; }
    .provider-box { border: 2px solid var(--primary); background: var(--pink-light); padding: 15px; border-radius: 10px; font-weight: 600; font-size: 1.1rem; display: inline-block; margin-bottom: 20px; }
    .readonly-input { background: #f0f0f0; color: #555; cursor: not-allowed; }
    .btn-group-payment { display: flex; gap: 15px; margin-top: 30px; }
    .btn-group-payment .btn { flex: 1; text-align: center; }
    .btn-disabled { background-color: #cccccc !important; color: #888888 !important; cursor: not-allowed !important; pointer-events: none; }
    input[type="file"] { background: #fff; padding: 10px; border: 1px dashed var(--border); width: 100%; }
  </style>
</head>
<body>

  <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.add('active')">☰</button>

  <aside class="sidebar">
    <button class="close-menu" onclick="document.querySelector('.sidebar').classList.remove('active')">✕</button>
    <a href="index.html" class="logo"><img src="img/SELARAS.png" alt="Logo"></a>
    <div class="menu-group">
      <a href="index.html" class="menu-item">Home</a>
      <a href="classes.html" class="menu-item active">Event</a>
      <a href="galeri.html" class="menu-item">Galeri</a>
      <a href="about.html" class="menu-item">About Us</a>
    </div>
    <div class="menu-group">
      <a href="contact.html" class="menu-item">Contact</a>
    </div>
  </aside>

  <main class="main-content">
    <div class="payment-box">
      <h1 class="page-title">Payment</h1>
      <p class="page-subtitle" style="margin-bottom: 30px;">Complete payment to submit your booking request.</p>

      <form id="paymentForm">
        
        <div class="form-group">
          <label class="form-label">Payment Provider *</label>
          <div class="provider-box">BCA</div>
        </div>

        <div class="form-group">
          <label class="form-label">Transfer Ke *</label>
          <input type="text" class="form-control readonly-input" value="5395099938 (a.n Dwipayani Aulia)" readonly>
        </div>

        <div class="form-group">
          <label class="form-label">Booking Untuk *</label>
          <input type="text" id="inpKelas" class="form-control readonly-input" readonly>
        </div>
        
        <div class="form-group">
          <label class="form-label">Jumlah Peserta</label>
          <input type="text" id="inpPeserta" class="form-control readonly-input" readonly>
        </div>
        <div class="form-group" id="grupPasangan" style="display: none;">
          <label class="form-label">Nama Pasangan</label>
          <input type="text" id="inpPasangan" class="form-control readonly-input" readonly>
        </div>
        <div class="form-group" id="grupMatrasPayment">
          <label class="form-label">Sewa Matras</label>
          <input type="text" id="inpMatras" class="form-control readonly-input" readonly>
        </div>

        <div class="form-group" id="grupCatatan" style="display: none;">
          <label class="form-label">Catatan Tambahan</label>
          <textarea id="inpCatatan" class="form-control readonly-input" rows="2" readonly></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Payment Amount *</label>
          <input type="text" id="inpHarga" class="form-control readonly-input" value="Memuat harga..." readonly>
        </div>

        <div class="form-group">
          <label class="form-label">Upload Bukti Pembayaran *</label>
          <input type="file" id="buktiTransfer" accept="image/*" required>
          <small style="color: var(--text-muted); margin-top: 5px; display: block;">Format: JPG, PNG.</small>
        </div>

        <div class="btn-group-payment">
          <a href="classes.html" class="btn btn-outline">Back</a>
          <button type="submit" id="btnSelesai" class="btn btn-primary btn-disabled" disabled>Selesai</button>
        </div>

      </form>
    </div>
  </main>

  <script type="module">
    import { firebaseConfig, app } from './firebase-config.js';
    import { getFirestore, collection, addDoc, doc, getDoc, updateDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);

    // 1. Ambil Data dari URL (HARGA SENGAJA TIDAK DIAMBIL DARI URL)
    const urlParams = new URLSearchParams(window.location.search);
    const kelas = urlParams.get('kelas') || 'Kelas Reguler';
    const namaUser = urlParams.get('nama') || '-';
    const emailUser = urlParams.get('email') || '-';
    const waUser = urlParams.get('wa') || '-';
    const idKelas = urlParams.get('id') || '';
    const jumlahPeserta = parseInt(urlParams.get('peserta')) || 1;
    const namaPasangan = urlParams.get('pasangan') || '';
    const jenisMatras = urlParams.get('matras') || 'bawa';
    const catatanUser = urlParams.get('catatan') || '';
    const kodePromo = urlParams.get('kodePromo') || '';
    const kategoriEvent = urlParams.get('kategori') || 'Yoga';

    // 2. Tampilkan Data Non-Harga ke Form
    document.getElementById('inpKelas').value = kelas;
    document.getElementById('inpPeserta').value = jumlahPeserta + ' Orang';
    
    if (jumlahPeserta === 2 && namaPasangan !== '') {
      document.getElementById('grupPasangan').style.display = 'block';
      document.getElementById('inpPasangan').value = namaPasangan;
    }

    const grupMatrasPayment = document.getElementById('grupMatrasPayment');
    const butuhMatras = (kategoriEvent.toLowerCase() === 'yoga' || kategoriEvent.toLowerCase() === 'pilates');

    let biayaMatras = 0;
    if (butuhMatras) {
      let teksMatras = 'Bawa Sendiri';
      if (jenisMatras === 'sewa1') { teksMatras = 'Sewa 1 Matras (+Rp 10.000)'; biayaMatras = 10000; }
      if (jenisMatras === 'sewa2') { teksMatras = 'Sewa 2 Matras (+Rp 20.000)'; biayaMatras = 20000; }
      document.getElementById('inpMatras').value = teksMatras;
    } else {
      grupMatrasPayment.style.display = 'none';
    }

    if (catatanUser !== '') {
      document.getElementById('grupCatatan').style.display = 'block';
      document.getElementById('inpCatatan').value = catatanUser;
    }

    // 3. HITUNG HARGA AMAN DARI DATABASE (Anti-Hack)
    let hargaFinal = 0;

    async function hitungHargaAman() {
      try {
        const kelasRef = doc(db, "classes", idKelas);
        const kelasSnap = await getDoc(kelasRef);

        if (!kelasSnap.exists()) {
          alert("Data kelas tidak ditemukan di database!");
          window.location.href = 'classes.html';
          return;
        }

        const dataKelas = kelasSnap.data();
        
        // PENTING: Pastiin field di Firestore namanya 'harga' dan 'hargaBundling'
        let hargaDasar = dataKelas.harga || 0;
        let hargaBundling = dataKelas.hargaBundling || 0;

        // Tentukan harga paket
        let hargaPaket = (jumlahPeserta === 2) ? hargaBundling : hargaDasar;

        // Hitung Diskon Promo
        let diskon = 0;
        if (kodePromo && kodePromo !== '' && jumlahPeserta === 1) {
          if (dataKelas.kodePromo === kodePromo) {
            const q = query(collection(db, "orders"), 
              where("kelas", "==", kelas), 
              where("kodePromo", "==", kodePromo), 
              where("status", "in", ["Pending", "Success"])
            );
            const snap = await getDocs(q);
            
            if (snap.size < dataKelas.kuotaPromo) {
              const persen = dataKelas.diskonPromo || 0;
              diskon = Math.round(hargaPaket * (persen / 100));
            } else {
              alert("Maaf, kuota promo sudah habis. Harga akan disesuaikan tanpa promo.");
            }
          } else {
            alert("Kode promo tidak valid. Harga akan disesuaikan tanpa promo.");
          }
        }

        // Total Akhir
        hargaFinal = hargaPaket + biayaMatras - diskon;
        if (hargaFinal < 0) hargaFinal = 0;

        // Tampilkan ke layar
        document.getElementById('inpHarga').value = 'Rp ' + hargaFinal.toLocaleString('id-ID');

      } catch (error) {
        console.error("Gagal menghitung harga: ", error);
        alert("Terjadi kesalahan sistem saat menghitung harga.");
      }
    }

    // Panggil fungsi hitung harga saat halaman dimuat
    hitungHargaAman();

    // 4. Logika Tombol Disable
    document.getElementById('buktiTransfer').addEventListener('change', function() {
      const btnSelesai = document.getElementById('btnSelesai');
      if (this.files.length > 0) {
        btnSelesai.classList.remove('btn-disabled');
        btnSelesai.removeAttribute('disabled');
      } else {
        btnSelesai.classList.add('btn-disabled');
        btnSelesai.setAttribute('disabled', 'true');
      }
    });

    // 5. Proses Submit
    document.getElementById('paymentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      if (hargaFinal <= 0) {
        alert("Harga belum valid atau masih loading. Mohon tunggu sebentar.");
        return;
      }

      const btnSelesai = document.getElementById('btnSelesai');
      btnSelesai.innerText = 'Memproses...';
      btnSelesai.disabled = true;

      try {
        const fileBukti = document.getElementById('buktiTransfer').files[0];
        
        // Upload ke Cloudinary
        const cloudName = 'd4cltmgp'; 
        const uploadPreset = 'selaras_bukti';
        const formData = new FormData();
        formData.append('file', fileBukti);
        formData.append('upload_preset', uploadPreset);

        const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
          method: 'POST',
          body: formData
        });
        
        const cloudinaryData = await response.json();

        // Validasi upload Cloudinary
        if (!response.ok || !cloudinaryData.secure_url) {
          throw new Error("Upload bukti transfer gagal. Pastikan format gambar benar.");
        }

        const buktiUrl = cloudinaryData.secure_url;

        // Simpan ke Firestore pakai HargaFinal (yang udah aman)
        await addDoc(collection(db, "orders"), {
          idKelas: idKelas,
          nama: namaUser,
          email: emailUser,
          wa: waUser,
          kelas: kelas,
          totalHarga: hargaFinal, // <--- PAKAI HARGA AMAN DARI DATABASE
          jumlahPeserta: jumlahPeserta,
          namaPasangan: namaPasangan,
          matras: jenisMatras,
          catatan: catatanUser,
          buktiTransfer: buktiUrl,
          status: "Pending",
          tanggal: new Date(),
          kodePromo: kodePromo
        });

        // Kurangi kuota kelas (Aman pakai increment)
        if (idKelas && idKelas !== '') {
          const kelasRef = doc(db, "classes", idKelas);
          await updateDoc(kelasRef, {
            kuotaTersisa: increment(-jumlahPeserta)
          });
        }

        window.location.href = 'success.html';
      } catch (error) {
        console.error("Error booking: ", error);
        alert(error.message || 'Gagal memproses pesanan.');
        btnSelesai.innerText = 'Selesai';
        btnSelesai.disabled = false;
      }
    });
  </script>

</body>
</html>
