        Classes & Pricing

      <a href="galeri.html" class="menu-item">

        Contact

  <!-- KONTEN PEMBAYARAN -->
  <main class="main-content">
    <h1 class="page-title">Konfirmasi Pesanan</h1>
    <p class="page-subtitle">Lengkapi data dirimu untuk melanjutkan pembayaran.</p>

    <div style="background: #fff; padding: 40px; border-radius: 16px; border: 1px solid var(--border); max-width: 600px;">
      
      <!-- Ringkasan Pesanan -->
      <div style="background: var(--pink-light); padding: 20px; border-radius: 12px; margin-bottom: 30px;">
        <h3 style="font-size: 1.1rem; margin-bottom: 10px; color: var(--primary);">Ringkasan Kelas</h3>
        <p style="font-weight: 500;">Ease Into Sleep : After Hour Stress Release</p>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Total Tagihan: <strong>Rp 115.000</strong></p>
      </div>

      <!-- Form Data Diri -->
      <form onsubmit="event.preventDefault(); alert('Lanjut ke sistem pembayaran (Midtrans/Xendit) - Dalam Pengembangan');">
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" class="form-control" placeholder="Masukkan nama" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" class="form-control" placeholder="email@contoh.com" required>
        </div>
        <div class="form-group">
          <label>Nomor WhatsApp</label>
          <input type="tel" class="form-control" placeholder="08123456789" required>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px;">Lanjut ke Pembayaran</button>
      </form>
      
      <p style="text-align: center; margin-top: 15px; font-size: 0.85rem; color: var(--text-muted);">
        *Karena ini masih tahap pengembangan, tombol ini belum memproses uang sungguhan.
      </p>
    </div>

  </main>

</body>
