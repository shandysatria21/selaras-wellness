<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - Yoga Fest</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .payment-box { max-width: 550px; }
    .form-label { font-weight: 500; margin-bottom: 8px; display: block; font-size: 1rem; }
    .provider-box { border: 2px solid var(--primary); background: var(--pink-light); padding: 15px; border-radius: 10px; font-weight: 600; font-size: 1.1rem; display: inline-block; margin-bottom: 20px; }
    .readonly-input { background: #f0f0f0; color: #555; cursor: not-allowed; }
    .btn-group-payment { display: flex; gap: 15px; margin-top: 30px; }
    .btn-group-payment .btn { flex: 1; text-align: center; }
    .btn-disabled { background-color: #cccccc !important; color: #888888 !important; cursor: not-allowed !important; pointer-events: none; }
    input[type="file"] { background: #fff; padding: 10px; border: 1px dashed var(--border); width: 100%; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <a href="index.html" class="logo">
  <img src="img/SELARAS.png" alt="Selaras Logo">
</a>
    
    <div class="menu-group">
      <a href="index.html" class="menu-item">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Home
      </a>
      <a href="classes.html" class="menu-item active">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        Classes & Pricing
      </a>
      <a href="galeri.html" class="menu-item">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        Galeri
      </a>
      <!-- MENU ABOUT US (AKTIF) -->
      <a href="about.html" class="menu-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        About Us
      </a>
    </div>

    <div class="menu-group">
      <a href="contact.html" class="menu-item">
        <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        Contact
      </a>
    </div>
  </aside>

  <main class="main-content">
    <div class="payment-box">
      <h1 class="page-title">Payment</h1>
      <p class="page-subtitle" style="margin-bottom: 30px;">Complete payment to submit your booking request. Your reservation will be pending approval until confirmed by the studio.</p>

      <form id="paymentForm">
        
        <div class="form-group">
          <label class="form-label">Payment Provider *</label>
          <div class="provider-box">BCA</div>
        </div>

        <div class="form-group">
          <label class="form-label">Transfer Ke *</label>
          <input type="text" class="form-control readonly-input" value="5395099938 (a.n Selaras Studio)" readonly>
        </div>

        <div class="form-group">
          <label class="form-label">Booking Untuk *</label>
          <input type="text" id="inpKelas" class="form-control readonly-input" readonly>
        </div>
        
        <div class="form-group">
          <label class="form-label">Payment Amount *</label>
          <input type="text" id="inpHarga" class="form-control readonly-input" readonly>
        </div>

        <div class="form-group">
          <label class="form-label">Upload Bukti Pembayaran *</label>
          <input type="file" id="buktiTransfer" accept="image/*" onchange="cekFile()" required>
          <small style="color: var(--text-muted); margin-top: 5px; display: block;">Format: JPG, PNG.</small>
        </div>

        <div class="btn-group-payment">
          <a href="classes.html" class="btn btn-outline">Back</a>
          <button type="submit" id="btnSelesai" class="btn btn-primary btn-disabled" disabled>Selesai</button>
        </div>

      </form>
    </div>
  </main>

  <script type="module">
    import { firebaseConfig, app } from './firebase-config.js';
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);

    // 1. Ambil Data dari URL
    const urlParams = new URLSearchParams(window.location.search);
    const kelas = urlParams.get('kelas') || 'Kelas Reguler';
    const harga = urlParams.get('harga') || '0';
    const namaUser = urlParams.get('nama') || '-';
    const emailUser = urlParams.get('email') || '-';
    const waUser = urlParams.get('wa') || '-';

    // 2. Tampilkan ke Form
    document.getElementById('inpKelas').value = kelas;
    document.getElementById('inpHarga').value = 'Rp ' + parseInt(harga).toLocaleString('id-ID');

    // 3. Logika Tombol Disable
    window.cekFile = function() {
      const fileInput = document.getElementById('buktiTransfer');
      const btnSelesai = document.getElementById('btnSelesai');

      if (fileInput.files.length > 0) {
        btnSelesai.classList.remove('btn-disabled');
        btnSelesai.removeAttribute('disabled');
      } else {
        btnSelesai.classList.add('btn-disabled');
        btnSelesai.setAttribute('disabled', 'true');
      }
    }

    // 4. Proses Submit (Upload Bukti & Simpan Data)
    document.getElementById('paymentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btnSelesai = document.getElementById('btnSelesai');
      btnSelesai.innerText = 'Memproses...';
      btnSelesai.disabled = true;

            try {
        const fileBukti = document.getElementById('buktiTransfer').files[0];
        
        // --- PROSES UPLOAD KE CLOUDINARY ---
        // Ganti 'CLOUD_NAME_KAMU' dan 'PRESET_KAMU' sesuai milikmu
        const cloudName = 'd4cltmgp'; 
        const uploadPreset = 'selaras_bukti';

        const formData = new FormData();
        formData.append('file', fileBukti);
        formData.append('upload_preset', uploadPreset);

        // Kirim ke API Cloudinary
        const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          throw new Error('Gagal upload ke Cloudinary');
        }

        const cloudinaryData = await response.json();
        const buktiUrl = cloudinaryData.secure_url; // Ini URL gambar dari Cloudinary

        // --- SIMPAN KE FIRESTORE ---
        await addDoc(collection(db, "orders"), {
          nama: namaUser,
          email: emailUser,
          wa: waUser,
          kelas: kelas,
          totalHarga: parseInt(harga),
          buktiTransfer: buktiUrl, // Simpan URL Cloudinary
          status: "Pending",
          tanggal: new Date()
        });

        // Jika sukses, lempar ke halaman sukses
        window.location.href = 'success.html';
        
      } catch (error) {
        console.error("Error booking: ", error);
        alert('Gagal memproses pesanan. Cek console.');
        // ... (kode tombol reset)
      }
    });
  </script>

</body>
</html>
