    <section class="quote-section">
      <blockquote id="aboutQuote">"Yoga is the journey of the self, through the self, to the self."</blockquote>

    <h2 style="font-size: 2rem; font-weight: 700; margin-bottom: 10px; text-align: center;">Filosofi Kami</h2>

        <section class="about-values" id="filosofiContainer">
      <!-- Akan diisi via JS -->
    </section>
  </main>

  <script type="module">
    import { firebaseConfig, app } from './firebase-config.js';
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);
    const aboutJudul = document.getElementById('aboutJudul');
    const aboutDesc = document.getElementById('aboutDesc');
    const aboutGambar = document.getElementById('aboutGambar');

    async function loadAboutText() {
      try {
        const docRef = doc(db, "pengaturan", "data-web");
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();

          document.getElementById('aboutQuote').innerHTML = `"${data.aboutQuote || 'Yoga is the journey of the self...'}"<br><span style="font-size: 1rem; font-weight: 400; color: var(--text-muted); font-style: normal; display: block; margin-top: 15px;">— The Bhagavad Gita</span>`;
          
          // Set Teks
          aboutJudul.innerHTML = data.aboutJudul || "Temukan Ruang<br>Untuk Dirimu.";
          aboutDesc.innerText = data.aboutDesc || "Selaras Wellness Club didirikan pada tahun 2020 dengan satu misi sederhana: menciptakan ruang yang aman dan tenang di tengah hiruk-pikuk kota.";
          
          // HANYA ubah gambar JIKA di database ada datanya
          if (data.aboutGambar && data.aboutGambar !== "") {
            aboutGambar.style.backgroundImage = `url('${data.aboutGambar}')`;
          }
        }
      } catch (error) {
        console.error("Error load text: ", error);
      }
    }

    loadAboutText();
  </script>
