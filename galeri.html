<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Galeri - Yoga Fest</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <aside class="sidebar">
    <a href="index.html" class="logo">SELARAS.</a>
    <div class="menu-group">
      <a href="index.html" class="menu-item">Home</a>
      <a href="classes.html" class="menu-item">Book a Class</a>
      <a href="galeri.html" class="menu-item">Galeri</a>
      <a href="about.html" class="menu-item">About Us</a>
    </div>
    <div class="menu-group">
      <a href="contact.html" class="menu-item">Contact</a>
    </div>
  </aside>

  <main class="main-content">
    <h1 class="page-title">Galeri Momen</h1>
    <p class="page-subtitle">Intip keseruan dan ketenangan di studio kami.</p>

    <div class="gallery-grid">
      <div class="gallery-item"><img src="https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&w=600&q=80" alt="Yoga 1"></div>
      <div class="gallery-item"><img src="https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=600&q=80" alt="Yoga 2"></div>
      <div class="gallery-item"><img src="https://images.unsplash.com/photo-1599901860904-17e6ed7083a0?auto=format&fit=crop&w=600&q=80" alt="Yoga 3"></div>
      <div class="gallery-item"><img src="https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&w=600&q=80" alt="Yoga 4"></div>
      <div class="gallery-item"><img src="https://images.unsplash.com/photo-1575052814086-f385e2e2ad1b?auto=format&fit=crop&w=600&q=80" alt="Yoga 5"></div>
      <div class="gallery-item"><img src="https://images.unsplash.com/photo-1552196563-55cd4e45efb3?auto=format&fit=crop&w=600&q=80" alt="Yoga 6"></div>
    </div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" onclick="document.getElementById('lightbox').classList.remove('active')">&times;</span>
    <img id="lightbox-img" src="" alt="Preview">
  </div>

  <script>
    // Logika klik gambar untuk memperbesar (Lightbox)
    document.querySelectorAll('.gallery-item img').forEach(img => {
      img.addEventListener('click', function() {
        document.getElementById('lightbox-img').src = this.src;
        document.getElementById('lightbox').classList.add('active');
      });
    });
  </script>

</body>
</html>
