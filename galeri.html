  <main class="main-content">
    <h1 class="page-title">Galeri Momen</h1>
    <p class="page-subtitle">Intip keseruan dan ketenangan di studio kami.</p>

    <div class="gallery-grid" id="containerGaleri">
      <p style="text-align: center; width: 100%;">Memuat foto...</p>
    </div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" onclick="document.getElementById('lightbox').classList.remove('active')">&times;</span>
    <img id="lightbox-img" src="" alt="Preview">
  </div>

  <script type="module">
    import { firebaseConfig, app } from './firebase-config.js';
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);
    const container = document.getElementById('containerGaleri');

    async function loadGaleriUser() {
      try {
        // Ambil data dari database, urutkan dari yang terbaru
        const q = query(collection(db, "galeri"), orderBy("tanggal", "desc"));
        const querySnapshot = await getDocs(q);

        container.innerHTML = '';

        if (querySnapshot.empty) {
          container.innerHTML = '<p style="text-align: center; width: 100%;">Belum ada foto di galeri.</p>';
          return;
        }

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          
          const div = document.createElement('div');
          div.className = 'gallery-item';
          div.innerHTML = `<img src="${data.url}" alt="Galeri">`;
          
          // Tambahkan efek klik untuk Lightbox
          div.querySelector('img').addEventListener('click', function() {
            document.getElementById('lightbox-img').src = this.src;
            document.getElementById('lightbox').classList.add('active');
          });
          
          container.appendChild(div);
        });
      } catch (error) {
        console.error("Error load galeri: ", error);
        container.innerHTML = '<p style="text-align: center; color: red;">Gagal memuat galeri.</p>';
      }
    }

    loadGaleriUser();
  </script>
