  <style>
    /* Style Khusus Section Instagram */

      background: var(--pink-light);

    .btn-ig {

      display: inline-flex;
      align-items: center;

      padding: 14px 30px;
      border-radius: 30px;

      box-shadow: 0 8px 25px rgba(220, 39, 67, 0.4);

    .btn-ig svg { width: 22px; height: 22px; fill: #fff; }

    <div class="menu-group">
      <a href="contact.html" class="menu-item">
        <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>

  <main class="main-content">
    <h1 class="page-title">Galeri Momen</h1>
    <p class="page-subtitle">Intip keseruan dan ketenangan di studio kami.</p>

    <!-- Grid Galeri -->
    <div class="gallery-grid" id="containerGaleri">
      <p style="text-align: center; width: 100%;">Memuat foto...</p>
    </div>

    <!-- Section Instagram CTA -->
    <div class="instagram-section">
      <h2>Bagikan Momenmu!</h2>
      <p>Ikuti keseruan kami setiap hari dan tag <strong>@selaras.club</strong> di Instagram.</p>
      <a href="https://instagram.com/selaras.club" target="_blank" class="btn-ig">
        <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
        Follow @selaras.club
      </a>
    </div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" onclick="document.getElementById('lightbox').classList.remove('active')">&times;</span>
    <img id="lightbox-img" src="" alt="Preview">
  </div>

  <script type="module">
    import { firebaseConfig, app } from './firebase-config.js';
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);
    const container = document.getElementById('containerGaleri');

    async function loadGaleriUser() {
      try {
        const q = query(collection(db, "galeri"), orderBy("tanggal", "desc"));
        const querySnapshot = await getDocs(q);

        container.innerHTML = '';

        if (querySnapshot.empty) {
          container.innerHTML = '<p style="text-align: center; width: 100%;">Belum ada foto di galeri.</p>';
          return;
        }

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          
          const div = document.createElement('div');
          div.className = 'gallery-item';
          div.innerHTML = `<img src="${data.url}" alt="Galeri">`;
          
          // Tambahkan efek klik untuk Lightbox
          div.querySelector('img').addEventListener('click', function() {
            document.getElementById('lightbox-img').src = this.src;
            document.getElementById('lightbox').classList.add('active');
          });
          
          container.appendChild(div);
        });
      } catch (error) {
        console.error("Error load galeri: ", error);
        container.innerHTML = '<p style="text-align: center; color: red;">Gagal memuat galeri.</p>';
      }
    }

    loadGaleriUser();
  </script>

</body>
</html>
