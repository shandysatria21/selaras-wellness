<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Event - Selaras Wellness Club</title>
         <!-- SEO Meta Tags -->
    <meta name="description" content="Detail Event Selaras Wellness Club. Daftar sekarang sebelum kuota habis!">
    
    <!-- Open Graph -->
    <meta property="og:title" content="Detail Event - Selaras Wellness Club">
    <meta property="og:description" content="Lihat detail jadwal dan daftar event wellness terbaik di sini.">
    <meta property="og:image" content="https://res.cloudinary.com/d4cltmgp/image/upload/w_1200,q_auto,f_auto/v1793759626/siukbjycabb4nedieou4.jpg">
    <meta property="og:url" content="https://selaraswellnessclub.com/detail-class.html">
    <meta property="og:type" content="website">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <style>
    /* Style Khusus Halaman Detail */
    .detail-wrapper { display: flex; gap: 50px; margin-top: 20px; align-items: flex-start; }
    .detail-img { flex: 1.2; height: 500px; border-radius: 24px; background-size: cover; background-position: center; box-shadow: 0 20px 40px rgba(0,0,0,0.1); position: relative; }
    
    .detail-badge { position: absolute; top: 20px; right: 20px; padding: 8px 20px; border-radius: 30px; font-weight: 700; font-size: 0.9rem; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    /* Warna badge detail */
    .badge-active { background: #fff; color: var(--primary); }
    .badge-inactive { background: #ef4444; color: #fff; }
    .badge-coming-soon { background: #3b82f6; color: #fff; }
    .badge-finished { background: #64748b; color: #fff; }

    .detail-info { flex: 1; padding-top: 10px; }
    .detail-info h1 { font-size: 2.8rem; margin-bottom: 15px; line-height: 1.1; letter-spacing: -1px; }
    .info-meta { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 30px; }
    .info-meta-item { background: #fff; border: 1px solid var(--border); padding: 8px 16px; border-radius: 12px; font-size: 0.9rem; font-weight: 500; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .detail-desc { font-size: 1.05rem; color: var(--text-muted); line-height: 1.8; margin-bottom: 30px; white-space: pre-wrap; border-left: 4px solid var(--pink-light); padding-left: 20px; }
    .detail-price-box { background: #fff; border: 1px solid var(--border); padding: 25px; border-radius: 20px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
    .price-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .price-row:last-child { margin-bottom: 0; }
    .price-title { font-weight: 600; color: var(--text-main); }
    .price-amount { font-size: 1.4rem; font-weight: 700; color: var(--primary); }
    .price-bundling { color: #10b981; }
    .price-bundling .price-amount { color: #10b981; font-size: 1.2rem; }
    .btn-book-large { display: block; width: 100%; padding: 18px; border-radius: 16px; font-size: 1.1rem; font-weight: 700; text-align: center; text-decoration: none; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: none; cursor: pointer; }
    
    .btn-active { background: var(--primary); color: #fff; box-shadow: 0 10px 20px rgba(196, 69, 118, 0.3); }
    .btn-active:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 25px rgba(196, 69, 118, 0.4); }
    
    .btn-disabled { background: #ccc; color: #fff; cursor: not-allowed; box-shadow: none; transform: none; }
    .btn-coming-soon { background: #3b82f6; color: #fff; cursor: not-allowed; box-shadow: none; }
    .btn-finished { background: #64748b; color: #fff; cursor: not-allowed; box-shadow: none; }

    @media (max-width: 1024px) {
      .detail-wrapper { flex-direction: column; gap: 30px; }
      .detail-img { width: 100% !important; height: 450px !important; min-height: 450px !important; display: block !important; }
      .detail-info h1 { font-size: 2.2rem; }
    }
    @media (max-width: 768px) {
      .detail-img { width: 100% !important; height: 300px !important; min-height: 300px !important; display: block !important; margin-bottom: 20px; }
      .detail-info h1 { font-size: 2rem; margin-top: 10px; }
      .detail-price-box { padding: 20px; }
      .detail-badge { top: 15px; right: 15px; padding: 6px 15px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

  <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.add('active')">☰</button>

  <aside class="sidebar">
    <button class="close-menu" onclick="document.querySelector('.sidebar').classList.remove('active')">✕</button>
    <a href="index.html" class="logo"><img src="img/SELARAS.png" alt="Logo"></a>
    <div class="menu-group">
      <a href="index.html" class="menu-item">Home</a>
      <a href="classes.html" class="menu-item active">Event</a>
      <a href="galeri.html" class="menu-item">Galeri</a>
      <a href="about.html" class="menu-item">About Us</a>
    </div>
    <div class="menu-group">
      <a href="contact.html" class="menu-item">Contact</a>
    </div>
  </aside>

  <main class="main-content">
    <a href="classes.html" class="btn btn-outline" style="margin-bottom: 10px; padding: 8px 20px;">&larr; Kembali ke Event</a>
    
    <div id="containerDetail" class="detail-wrapper">
      <p>Memuat data...</p>
    </div>
  </main>

  <script type="module">
    import { firebaseConfig, app } from './firebase-config.js';
    import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);
    const urlParams = new URLSearchParams(window.location.search);
    const slugKelas = urlParams.get('nama'); 
    const idKelas = urlParams.get('id'); 
    const container = document.getElementById('containerDetail');

    function formatTanggal(tglString) {
      if (!tglString) return '-';
      return new Date(tglString).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    async function loadDetail() {
      if (!slugKelas && !idKelas) {
        container.innerHTML = '<p>URL tidak valid.</p>';
        return;
      }

      try {
        let dataKelas = null;
        let idDokumen = idKelas;

        if (slugKelas) {
          const querySnapshot = await getDocs(collection(db, "classes"));
          querySnapshot.forEach((doc) => {
            const data = doc.data();
            const slugDatabase = data.nama.toLowerCase().replace(/\s+/g, '-').replace(/[^\w\-]+/g, '').replace(/\-\-+/g, '-').replace(/^-+/, '').replace(/-+$/, '');
            if (slugDatabase === slugKelas) {
              dataKelas = data;
              idDokumen = doc.id;
            }
          });
        } 
        
        if (!dataKelas && idDokumen) {
          const docSnap = await getDoc(doc(db, "classes", idDokumen));
          if (docSnap.exists()) { dataKelas = docSnap.data(); }
        }

        if (dataKelas) {
          // LOGIKA STATUS BARU
          const now = new Date();
          const eventDate = new Date(dataKelas.tanggal);
          eventDate.setHours(23, 59, 59, 999); 
          const isEventSelesai = now > eventDate;
          
          const isActive = dataKelas.statusAktif !== false;
          const isKuotaHabis = dataKelas.kuotaTersisa <= 0;
          
          let btnBook = '';
          let badgeText = '';
          let badgeClass = '';

          if (isEventSelesai) {
            badgeText = 'Event Selesai';
            badgeClass = 'badge-finished';
            btnBook = `<button class="btn-book-large btn-finished" disabled>Event Telah Selesai</button>`;
          } else if (!isActive) {
            badgeText = 'Coming Soon';
            badgeClass = 'badge-coming-soon';
            btnBook = `<button class="btn-book-large btn-coming-soon" disabled>Segera Hadir</button>`;
          } else if (isKuotaHabis) {
            badgeText = 'Kuota Habis';
            badgeClass = 'badge-inactive';
            btnBook = `<button class="btn-book-large btn-disabled" disabled>Kuota Habis</button>`;
          } else {
            badgeText = 'Tersedia';
            badgeClass = 'badge-active';
            btnBook = `<a href="form-booking.html?kelas=${encodeURIComponent(dataKelas.nama)}&harga=${dataKelas.harga}&hargaBundling=${dataKelas.hargaBundling || 0}&id=${idDokumen}&kategori=${encodeURIComponent(dataKelas.kategori || 'Yoga')}" class="btn-book-large btn-active">Book Now</a>`;
          }

          const hargaBundlingRupiah = dataKelas.hargaBundling ? 'Rp ' + dataKelas.hargaBundling.toLocaleString('id-ID') : null;

          container.innerHTML = `
            <div class="detail-img" style="background-image: url('${dataKelas.gambar}');">
              <div class="detail-badge ${badgeClass}">${badgeText}</div>
            </div>
            
            <div class="detail-info">
              <h1>${dataKelas.nama}</h1>
              
              <div class="info-meta">
                <div class="info-meta-item">👤 ${dataKelas.coach || '-'}</div>
                <div class="info-meta-item">📅 ${formatTanggal(dataKelas.tanggal)} • ${dataKelas.jam || '-'} WIB</div>
                <div class="info-meta-item">📍 ${dataKelas.lokasi || '-'}</div>
                <div class="info-meta-item">🎟️ Sisa ${dataKelas.kuotaTersisa || 0} Kuota</div>
              </div>
              
              <div class="detail-desc">${dataKelas.deskripsi || 'Belum ada deskripsi detail untuk Event ini. Silakan hubungi admin untuk informasi lebih lanjut.'}</div>
              
              <div class="detail-price-box">
                <div class="price-row">
                  <span class="price-title">Harga Satuan</span>
                  <span class="price-amount">Rp ${dataKelas.harga.toLocaleString('id-ID')}</span>
                </div>
                
                ${hargaBundlingRupiah ? `
                <div class="price-row price-bundling">
                  <span class="price-title">Bundling (2 Orang)</span>
                  <span class="price-amount">${hargaBundlingRupiah}</span>
                </div>
                ` : ''}
              </div>

              ${btnBook}
            </div>
          `;
        } else {
          container.innerHTML = '<p>Event tidak ditemukan.</p>';
        }
      } catch (error) {
        console.error(error);
        container.innerHTML = '<p>Gagal memuat data.</p>';
      }
    }

    loadDetail();
  </script>
</body>
</html>
