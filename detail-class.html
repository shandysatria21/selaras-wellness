<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Event - Selaras</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <style>
    /* Style Khusus Halaman Detail */
    .detail-wrapper {
      display: flex;
      gap: 50px;
      margin-top: 20px;
      align-items: flex-start;
    }
    
    .detail-img {
      flex: 1.2;
      height: 500px;
      border-radius: 24px;
      background-size: cover;
      background-position: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      position: relative;
    }

    .detail-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #fff;
      color: var(--primary);
      padding: 8px 20px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    
    .detail-info {
      flex: 1;
      padding-top: 10px;
    }

    .detail-info h1 {
      font-size: 2.8rem;
      margin-bottom: 15px;
      line-height: 1.1;
      letter-spacing: -1px;
    }

    .info-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 30px;
    }

    .info-meta-item {
      background: #fff;
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .detail-desc {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.8;
      margin-bottom: 30px;
      white-space: pre-wrap;
      border-left: 4px solid var(--pink-light);
      padding-left: 20px;
    }

    /* Kotak Harga Melayang */
    .detail-price-box {
      background: #fff;
      border: 1px solid var(--border);
      padding: 25px;
      border-radius: 20px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .price-row:last-child { margin-bottom: 0; }
    
    .price-title { font-weight: 600; color: var(--text-main); }
    .price-amount { font-size: 1.4rem; font-weight: 700; color: var(--primary); }
    
    .price-bundling { color: #10b981; }
    .price-bundling .price-amount { color: #10b981; font-size: 1.2rem; }

    /* Tombol Book Now */
    .btn-book-large {
      display: block;
      width: 100%;
      background: var(--primary);
      color: #fff;
      padding: 18px;
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 10px 20px rgba(196, 69, 118, 0.3);
    }

    .btn-book-large:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 25px rgba(196, 69, 118, 0.4);
    }

    .btn-book-large:disabled {
      background: #ccc;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

        @media (max-width: 1024px) {
      .detail-wrapper { flex-direction: column; gap: 30px; }
      .detail-img { 
        width: 100% !important; 
        height: 450px !important; 
        min-height: 450px !important; 
        display: block !important;
      }
      .detail-info h1 { font-size: 2.2rem; }
    }

    @media (max-width: 768px) {
      .detail-img { 
        width: 100% !important; 
        height: 300px !important; 
        min-height: 300px !important; 
        display: block !important; 
        margin-bottom: 20px;
      }
      .detail-info h1 { font-size: 2rem; margin-top: 10px; }
      .detail-price-box { padding: 20px; }
      
      /* Badge Tersedia biar nggak nabrak judul */
      .detail-badge {
        top: 15px;
        right: 15px;
        padding: 6px 15px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.add('active')">☰</button>

  <aside class="sidebar">
    <button class="close-menu" onclick="document.querySelector('.sidebar').classList.remove('active')">✕</button>
    <a href="index.html" class="logo"><img src="img/SELARAS.png" alt="Logo"></a>
    <div class="menu-group">
      <a href="index.html" class="menu-item">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Home
      </a>
      <a href="classes.html" class="menu-item active">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        Event
      </a>
      <a href="galeri.html" class="menu-item">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        Galeri
      </a>
    
      <a href="about.html" class="menu-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        About Us
      </a>
    </div>

    <div class="menu-group">
      <a href="contact.html" class="menu-item">
        <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        Contact
      </a>
    </div>
  </aside>

  <main class="main-content">
    <a href="classes.html" class="btn btn-outline" style="margin-bottom: 10px; padding: 8px 20px;">&larr; Kembali ke Event</a>
    
    <div id="containerDetail" class="detail-wrapper">
      <p>Memuat data...</p>
    </div>
  </main>

  <script type="module">
    import { firebaseConfig, app } from './firebase-config.js';
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);
    const urlParams = new URLSearchParams(window.location.search);
    const idKelas = urlParams.get('id');
    const container = document.getElementById('containerDetail');

    function formatTanggal(tglString) {
      if (!tglString) return '-';
      return new Date(tglString).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    async function loadDetail() {
      if (!idKelas) {
        container.innerHTML = '<p>ID Kelas tidak ditemukan.</p>';
        return;
      }

      try {
        const docRef = doc(db, "classes", idKelas);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          
          const isActive = data.statusAktif !== false;
          const isKuotaHabis = data.kuotaTersisa <= 0;
          let isBisaBooking = isActive && !isKuotaHabis;
          
          let btnBook = `<a href="form-booking.html?kelas=${encodeURIComponent(data.nama)}&harga=${data.harga}&hargaBundling=${data.hargaBundling || 0}&id=${idKelas}" class="btn-book-large">Book Now</a>`;
          
          if (!isBisaBooking) {
            btnBook = `<button class="btn-book-large" disabled>Event Ditutup / Penuh</button>`;
          }

          const hargaBundlingRupiah = data.hargaBundling ? 'Rp ' + data.hargaBundling.toLocaleString('id-ID') : null;

          container.innerHTML = `
            <div class="detail-img" style="background-image: url('${data.gambar}');">
              <div class="detail-badge">${isBisaBooking ? 'Tersedia' : 'Tutup'}</div>
            </div>
            
            <div class="detail-info">
              <h1>${data.nama}</h1>
              
              <div class="info-meta">
                <div class="info-meta-item">👤 ${data.coach || '-'}</div>
                <div class="info-meta-item">📅 ${formatTanggal(data.tanggal)} • ${data.jam || '-'} WIB</div>
                <div class="info-meta-item">📍 ${data.lokasi || '-'}</div>
                <div class="info-meta-item">🎟️ Sisa ${data.kuotaTersisa || 0} Kuota</div>
              </div>
              
              <div class="detail-desc">${data.deskripsi || 'Belum ada deskripsi detail untuk Event ini. Silakan hubungi admin untuk informasi lebih lanjut.'}</div>
              
              <div class="detail-price-box">
                <div class="price-row">
                  <span class="price-title">Harga Satuan</span>
                  <span class="price-amount">Rp ${data.harga.toLocaleString('id-ID')}</span>
                </div>
                
                ${hargaBundlingRupiah ? `
                <div class="price-row price-bundling">
                  <span class="price-title">Bundling (2 Orang)</span>
                  <span class="price-amount">${hargaBundlingRupiah}</span>
                </div>
                ` : ''}
              </div>

              ${btnBook}
            </div>
          `;
        } else {
          container.innerHTML = '<p>Event tidak ditemukan di database.</p>';
        }
      } catch (error) {
        console.error(error);
        container.innerHTML = '<p>Gagal memuat data.</p>';
      }
    }

    loadDetail();
  </script>
</body>
</html>
