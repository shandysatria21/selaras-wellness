<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Kelas - Selaras</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <style>
    .detail-wrapper {
      display: flex;
      gap: 40px;
      margin-top: 30px;
    }
    .detail-img {
      flex: 1;
      height: 400px;
      border-radius: 20px;
      background-size: cover;
      background-position: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .detail-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .detail-info h1 {
      font-size: 2.5rem;
      margin-bottom: 15px;
      line-height: 1.2;
    }
    .detail-badge {
      display: inline-block;
      background: var(--pink-light);
      color: var(--primary);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      width: fit-content;
    }
    .detail-desc {
      font-size: 1.1rem;
      color: var(--text-muted);
      line-height: 1.8;
      margin-bottom: 30px;
      white-space: pre-wrap; /* Biar enter dari admin kebaca */
    }
    .detail-price-box {
      background: #fff;
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 30px;
    }

    @media (max-width: 768px) {
      .detail-wrapper { flex-direction: column; gap: 20px; }
      .detail-img { height: 250px; }
      .detail-info h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>

  <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.add('active')">☰</button>

  <aside class="sidebar">
    <button class="close-menu" onclick="document.querySelector('.sidebar').classList.remove('active')">✕</button>
    <a href="index.html" class="logo"><img src="img/SELARAS.png" alt="Logo"></a>
    <div class="menu-group">
      <a href="index.html" class="menu-item">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Home
      </a>
      <a href="classes.html" class="menu-item active">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        Classes
      </a>
      <a href="galeri.html" class="menu-item">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        Galeri
      </a>
    
      <a href="about.html" class="menu-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        About Us
      </a>
    </div>

    <div class="menu-group">
      <a href="contact.html" class="menu-item">
        <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        Contact
      </a>
    </div>
  </aside>

  <main class="main-content">
    <a href="classes.html" class="btn btn-outline" style="margin-bottom: 20px;">&larr; Kembali ke Classes</a>
    
    <div id="containerDetail" class="detail-wrapper">
      <p>Memuat data...</p>
    </div>
  </main>

  <script type="module">
    import { firebaseConfig, app } from './firebase-config.js';
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);
    const urlParams = new URLSearchParams(window.location.search);
    const idKelas = urlParams.get('id');
    const container = document.getElementById('containerDetail');

    function formatTanggal(tglString) {
      if (!tglString) return '-';
      return new Date(tglString).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    async function loadDetail() {
      if (!idKelas) {
        container.innerHTML = '<p>ID Kelas tidak ditemukan.</p>';
        return;
      }

      try {
        const docRef = doc(db, "classes", idKelas);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          
          const isActive = data.statusAktif !== false;
          const isKuotaHabis = data.kuotaTersisa <= 0;
          
          let btnBook = `<a href="form-booking.html?kelas=${encodeURIComponent(data.nama)}&harga=${data.harga}&hargaBundling=${data.hargaBundling || 0}&id=${idKelas}" class="btn btn-primary" style="padding: 15px; font-size: 1.1rem; width: 100%; text-align: center;">Book Now</a>`;
          
          if (!isActive || isKuotaHabis) {
            btnBook = `<button class="btn btn-primary btn-disabled" style="padding: 15px; font-size: 1.1rem; width: 100%;">Kelas Ditutup / Penuh</button>`;
          }

          const hargaBundlingRupiah = data.hargaBundling ? 'Rp ' + data.hargaBundling.toLocaleString('id-ID') : null;

          container.innerHTML = `
            <div class="detail-img" style="background-image: url('${data.gambar}');"></div>
            
            <div class="detail-info">
              <div class="detail-badge">${data.statusAktif !== false ? 'Pendaftaran Dibuka' : 'Pendaftaran Ditutup'}</div>
              <h1>${data.nama}</h1>
              
              <p style="font-weight: 600; margin-bottom: 5px;">👤 Coach: ${data.coach || '-'}</p>
              <p style="margin-bottom: 5px;">📅 ${formatTanggal(data.tanggal)} • ${data.jam || '-'} WIB</p>
              <p style="margin-bottom: 20px;">📍 ${data.lokasi || '-'}</p>
              
              <div class="detail-desc">${data.deskripsi || 'Belum ada deskripsi untuk kelas ini.'}</div>
              
              <div class="detail-price-box">
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                  <span>Harga Satuan:</span>
                  <span style="font-weight: 700;">Rp ${data.harga.toLocaleString('id-ID')}</span>
                </div>
                ${hargaBundlingRupiah ? `
                <div style="display: flex; justify-content: space-between; color: #10b981; margin-bottom: 10px;">
                  <span>Bundling (2 Orang):</span>
                  <span style="font-weight: 700;">${hargaBundlingRupiah}</span>
                </div>
                ` : ''}
                <div style="display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--text-muted); border-top: 1px dashed var(--border); padding-top: 10px;">
                  <span>Sisa Kuota:</span>
                  <span>${data.kuotaTersisa || 0} / ${data.kuotaAwal || 0}</span>
                </div>
              </div>

              ${btnBook}
            </div>
          `;
        } else {
          container.innerHTML = '<p>Kelas tidak ditemukan di database.</p>';
        }
      } catch (error) {
        console.error(error);
        container.innerHTML = '<p>Gagal memuat data.</p>';
      }
    }

    loadDetail();
  </script>
</body>
</html>
