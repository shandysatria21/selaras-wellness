<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Booking - Selaras</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <style>
    .booking-box { max-width: 550px; }
    .form-label { font-weight: 500; margin-bottom: 8px; display: block; font-size: 1rem; }
    .radio-group { display: flex; flex-direction: column; gap: 10px; background: #fff; padding: 15px; border-radius: 10px; border: 1px solid var(--border); }
    .radio-group label { display: flex; align-items: center; gap: 8px; font-weight: 400; cursor: pointer; margin: 0; }
    input[type="radio"] { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }
  </style>
</head>
<body>

  <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.add('active')">☰</button>

  <aside class="sidebar">
    <button class="close-menu" onclick="document.querySelector('.sidebar').classList.remove('active')">✕</button>
    <a href="index.html" class="logo"><img src="img/SELARAS.png" alt="Logo"></a>
    <div class="menu-group">
      <a href="index.html" class="menu-item">Home</a>
      <a href="classes.html" class="menu-item active">Event</a>
      <a href="galeri.html" class="menu-item">Galeri</a>
      <a href="about.html" class="menu-item">About Us</a>
    </div>
    <div class="menu-group">
      <a href="contact.html" class="menu-item">Contact</a>
    </div>
  </aside>

  <main class="main-content">
    <div class="booking-box">
      <h1 class="page-title">Booking Detail</h1>
      <p class="page-subtitle" style="margin-bottom: 30px;">Lengkapi data dirimu sebelum melanjutkan ke pembayaran.</p>

      <form id="formBooking" onsubmit="prosesForm(event)">
        
        <!-- Info Event -->
        <div class="form-group" style="background: var(--pink-light); padding: 15px; border-radius: 10px; margin-bottom: 25px;">
          <span style="font-size: 0.9rem; color: var(--text-muted);">Event yang dipilih:</span>
          <h3 id="tampilKelas" style="color: var(--primary); font-size: 1.2rem; margin-top: 5px;">Memuat...</h3>
        </div>

        <!-- Data Diri -->
        <div class="form-group">
          <label class="form-label">Nama Lengkap (Pemesan) *</label>
          <input type="text" id="nama" class="form-control" placeholder="Masukkan nama" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email *</label>
          <input type="email" id="email" class="form-control" placeholder="email@contoh.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Nomor WhatsApp *</label>
          <input type="tel" id="wa" class="form-control" placeholder="08123456789" required>
        </div>

        <!-- Pilih Paket -->
        <div class="form-group">
          <label class="form-label">Pilih Paket *</label>
          <select id="pilihPaket" class="form-control" onchange="updateForm()" required>
            <!-- Opsi diisi JS -->
          </select>
        </div>

        <!-- Nama Pasangan (Bundling) -->
        <div class="form-group" id="grupNamaPasangan" style="display: none;">
          <label class="form-label" style="color: var(--primary);">Nama Peserta ke-2 (Pasangan) *</label>
          <input type="text" id="namaPasangan" class="form-control" placeholder="Masukkan nama pasangan">
        </div>

        <!-- Pilihan Matras (Hanya Yoga/Pilates) -->
        <div class="form-group" id="grupPilihanMatras">
          <label class="form-label">Pilihan Matras *</label>
          <div class="radio-group" id="grupMatras"></div>
        </div>

        <!-- Catatan Tambahan -->
        <div class="form-group">
          <label class="form-label">Catatan Tambahan (Opsional)</label>
          <textarea id="catatan" class="form-control" rows="2" placeholder="Contoh: Pesan minuman matcha, ada cedera punggung, dll."></textarea>
        </div>

        <!-- Ringkasan Harga -->
        <div style="background: #fff; border: 1px dashed var(--primary); padding: 15px; border-radius: 10px; margin-bottom: 20px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
            <span>Harga Paket:</span>
            <span id="subtotalTiket">Rp 0</span>
          </div>
          <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
            <span>Sewa Matras:</span>
            <span id="biayaMatras">Rp 0</span>
          </div>
          <hr style="border: 0; border-top: 1px solid var(--border); margin: 10px 0;">
          <div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 1.2rem;">
            <span>Total Bayar:</span>
            <span id="totalAkhir" style="color: var(--primary);">Rp 0</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Lanjut ke Pembayaran</button>
      </form>
    </div>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const namaKelas = urlParams.get('kelas') || 'Event Reguler';
    const hargaDasar = parseInt(urlParams.get('harga')) || 0;
    const hargaBundling = parseInt(urlParams.get('hargaBundling')) || 0;
    const idKelas = urlParams.get('id') || '';
    const kategoriEvent = urlParams.get('kategori') || 'Yoga'; // Ambil kategori dari URL

    document.getElementById('tampilKelas').innerText = namaKelas;

    const selectPaket = document.getElementById('pilihPaket');
    selectPaket.innerHTML = `<option value="1" data-harga="${hargaDasar}">1 Orang (Reguler) - Rp ${hargaDasar.toLocaleString('id-ID')}</option>`;
    if (hargaBundling > 0) {
      selectPaket.innerHTML += `<option value="2" data-harga="${hargaBundling}">2 Orang (Bundling) - Rp ${hargaBundling.toLocaleString('id-ID')}</option>`;
    }

    function updateForm() {
      const jumlahPeserta = parseInt(selectPaket.value);
      const grupPasangan = document.getElementById('grupNamaPasangan');
      const grupPilihanMatras = document.getElementById('grupPilihanMatras');
      const grupMatras = document.getElementById('grupMatras');

      // Logika Nama Pasangan
      if (jumlahPeserta === 2) {
        grupPasangan.style.display = 'block';
        document.getElementById('namaPasangan').setAttribute('required', 'true');
      } else {
        grupPasangan.style.display = 'none';
        document.getElementById('namaPasangan').removeAttribute('required');
        document.getElementById('namaPasangan').value = '';
      }

      // Logika Matras (Hanya untuk Yoga & Pilates)
      const butuhMatras = (kategoriEvent.toLowerCase() === 'yoga' || kategoriEvent.toLowerCase() === 'pilates');
      
      if (butuhMatras) {
        grupPilihanMatras.style.display = 'block';
        if (jumlahPeserta === 1) {
          grupMatras.innerHTML = `
            <label><input type="radio" name="matras" value="bawa" checked onchange="hitungTotal()"> Bawa Sendiri</label>
            <label><input type="radio" name="matras" value="sewa1" onchange="hitungTotal()"> Sewa 1 Mat (+ Rp 10.000)</label>
          `;
        } else {
          grupMatras.innerHTML = `
            <label><input type="radio" name="matras" value="bawa" checked onchange="hitungTotal()"> Bawa Sendiri Semua</label>
            <label><input type="radio" name="matras" value="sewa1" onchange="hitungTotal()"> Sewa 1 Mat (+ Rp 10.000)</label>
            <label><input type="radio" name="matras" value="sewa2" onchange="hitungTotal()"> Sewa 2 Mat (+ Rp 20.000)</label>
          `;
        }
      } else {
        grupPilihanMatras.style.display = 'none';
        grupMatras.innerHTML = ''; 
      }

      hitungTotal();
    }

    function hitungTotal() {
      const opsiTerpilih = selectPaket.options[selectPaket.selectedIndex];
      const hargaPaket = parseInt(opsiTerpilih.getAttribute('data-harga')); 
      
      const matrasTerpilih = document.querySelector('input[name="matras"]:checked');
      const nilaiMatras = matrasTerpilih ? matrasTerpilih.value : 'bawa';
      
      let biayaMatras = 0;
      if (matrasTerpilih) {
        if (nilaiMatras === 'sewa1') biayaMatras = 10000;
        if (nilaiMatras === 'sewa2') biayaMatras = 20000;
      }

      let totalAkhir = hargaPaket + biayaMatras;

      document.getElementById('subtotalTiket').innerText = `Rp ${hargaPaket.toLocaleString('id-ID')}`;
      document.getElementById('biayaMatras').innerText = `Rp ${biayaMatras.toLocaleString('id-ID')}`;
      document.getElementById('totalAkhir').innerText = `Rp ${totalAkhir.toLocaleString('id-ID')}`;
    }

    updateForm(); // Panggil saat pertama kali dibuka

    function prosesForm(event) {
      event.preventDefault();
      const nama = document.getElementById('nama').value;
      const email = document.getElementById('email').value;
      const wa = document.getElementById('wa').value;
      const jumlahPeserta = selectPaket.value;
      const namaPasangan = jumlahPeserta === "2" ? document.getElementById('namaPasangan').value : '';
      const catatan = document.getElementById('catatan').value;
      
      let matrasTerpilih = 'bawa';
      const radioMatras = document.querySelector('input[name="matras"]:checked');
      if (radioMatras) matrasTerpilih = radioMatras.value;

      let totalAkhir = parseInt(document.getElementById('totalAkhir').innerText.replace(/[^0-9]/g, ''));

      // Kirim kategori ke URL Payment
      const paymentUrl = `payment.html?kelas=${encodeURIComponent(namaKelas)}&harga=${totalAkhir}&nama=${encodeURIComponent(nama)}&email=${encodeURIComponent(email)}&wa=${encodeURIComponent(wa)}&id=${idKelas}&peserta=${jumlahPeserta}&pasangan=${encodeURIComponent(namaPasangan)}&matras=${matrasTerpilih}&catatan=${encodeURIComponent(catatan)}&kategori=${encodeURIComponent(kategoriEvent)}`;
      
      window.location.href = paymentUrl;
    }
  </script>

</body>
</html>
