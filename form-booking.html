<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Booking - Selaras Wellness Club</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <style>
    .booking-box { max-width: 550px; }
    .form-label { font-weight: 500; margin-bottom: 8px; display: block; font-size: 1rem; }
    .radio-group { display: flex; flex-direction: column; gap: 10px; background: #fff; padding: 15px; border-radius: 10px; border: 1px solid var(--border); }
    .radio-group label { display: flex; align-items: center; gap: 8px; font-weight: 400; cursor: pointer; margin: 0; }
    input[type="radio"] { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }
    .promo-input-group { display: flex; gap: 10px; }
    .promo-input-group input { flex: 1; text-transform: uppercase; }
  </style>
</head>
<body>

  <button class="menu-toggle" id="menuToggle">☰</button>

  <aside class="sidebar" id="sidebar">
    <button class="close-menu" id="closeMenu">✕</button>
    <a href="index.html" class="logo"><img src="img/SELARAS.png" alt="Logo"></a>
    <div class="menu-group">
      <a href="index.html" class="menu-item">Home</a>
      <a href="classes.html" class="menu-item active">Event</a>
      <a href="galeri.html" class="menu-item">Galeri</a>
      <a href="about.html" class="menu-item">About Us</a>
    </div>
    <div class="menu-group">
      <a href="contact.html" class="menu-item">Contact</a>
    </div>
  </aside>

  <main class="main-content">
    <div class="booking-box">
      <h1 class="page-title">Booking Detail</h1>
      <p class="page-subtitle" style="margin-bottom: 30px;">Lengkapi data dirimu sebelum melanjutkan ke pembayaran.</p>

      <form id="formBooking">
        
        <div class="form-group" style="background: var(--pink-light); padding: 15px; border-radius: 10px; margin-bottom: 25px;">
          <span style="font-size: 0.9rem; color: var(--text-muted);">Event yang dipilih:</span>
          <h3 id="tampilKelas" style="color: var(--primary); font-size: 1.2rem; margin-top: 5px;">Memuat...</h3>
        </div>

        <div class="form-group">
          <label class="form-label">Nama Lengkap (Pemesan) *</label>
          <input type="text" id="nama" class="form-control" placeholder="Masukkan nama" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email *</label>
          <input type="email" id="email" class="form-control" placeholder="email@contoh.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Nomor WhatsApp *</label>
          <input type="tel" id="wa" class="form-control" placeholder="08123456789" required>
        </div>

        <div class="form-group">
          <label class="form-label">Pilih Paket *</label>
          <select id="pilihPaket" class="form-control" required>
            <!-- Opsi diisi JS -->
          </select>
        </div>

        <div class="form-group" id="grupNamaPasangan" style="display: none;">
          <label class="form-label" style="color: var(--primary);">Nama Peserta ke-2 (Pasangan) *</label>
          <input type="text" id="namaPasangan" class="form-control" placeholder="Masukkan nama pasangan">
        </div>

        <div class="form-group" id="grupPilihanMatras">
          <label class="form-label">Pilihan Matras *</label>
          <div class="radio-group" id="grupMatras"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Catatan Tambahan (Opsional)</label>
          <textarea id="catatan" class="form-control" rows="2" placeholder="Contoh: Pesan minuman matcha, ada cedera punggung, dll."></textarea>
        </div>

        <!-- KODE PROMO -->
        <div class="form-group">
          <label class="form-label">Punya Kode Promo?</label>
          <div class="promo-input-group">
            <input type="text" id="inputKodePromo" class="form-control" placeholder="Ketik kode di sini...">
            <button type="button" id="btnCekPromo" class="btn btn-outline" style="padding: 10px 20px; border-radius: 10px;">Cek Kode</button>
          </div>
          <small id="pesanPromo" style="font-size: 0.85rem; margin-top: 5px; display: none;"></small>
        </div>

        <div style="background: #fff; border: 1px dashed var(--primary); padding: 15px; border-radius: 10px; margin-bottom: 20px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
            <span>Harga Paket:</span>
            <span id="subtotalTiket">Rp 0</span>
          </div>
          <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
            <span>Sewa Matras:</span>
            <span id="biayaMatras">Rp 0</span>
          </div>
          <div id="barisDiskon" style="display: none; justify-content: space-between; margin-bottom: 10px; color: #10b981;">
            <span>Diskon Promo:</span>
            <span id="nominalDiskon">- Rp 0</span>
          </div>
          <hr style="border: 0; border-top: 1px solid var(--border); margin: 10px 0;">
          <div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 1.2rem;">
            <span>Total Bayar:</span>
            <span id="totalAkhir" style="color: var(--primary);">Rp 0</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Lanjut ke Pembayaran</button>
      </form>
    </div>
  </main>

  <script type="module">
    import { firebaseConfig, app } from './firebase-config.js';
    import { getFirestore, collection, getDocs, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);

    // ==== UI SIDEBAR ====
    document.getElementById('menuToggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.add('active');
    });
    document.getElementById('closeMenu').addEventListener('click', () => {
      document.getElementById('sidebar').classList.remove('active');
    });

    // ==== URL PARAMS ====
    const urlParams = new URLSearchParams(window.location.search);
    const namaKelas = urlParams.get('kelas') || 'Event Reguler';
    const hargaDasar = parseInt(urlParams.get('harga')) || 0;
    const hargaBundling = parseInt(urlParams.get('hargaBundling')) || 0;
    const idKelas = urlParams.get('id') || '';
    const kategoriEvent = urlParams.get('kategori') || 'Yoga';

    document.getElementById('tampilKelas').innerText = namaKelas;

    // ==== STATE VARIABEL ====
    let diskonAktif = 0; 
    let kodePromoDipakai = '';
    let persenDiskonAktif = 0;

    // ==== ELEMENT REFS ====
    const selectPaket = document.getElementById('pilihPaket');
    const grupPasangan = document.getElementById('grupNamaPasangan');
    const inputNamaPasangan = document.getElementById('namaPasangan');
    const grupPilihanMatras = document.getElementById('grupPilihanMatras');
    const grupMatras = document.getElementById('grupMatras');
    const inputKodePromo = document.getElementById('inputKodePromo');
    const btnCekPromo = document.getElementById('btnCekPromo');
    const pesanEl = document.getElementById('pesanPromo');

    // ==== ISI PAKET ====
    selectPaket.innerHTML = `<option value="1" data-harga="${hargaDasar}">1 Orang (Reguler) - Rp ${hargaDasar.toLocaleString('id-ID')}</option>`;
    if (hargaBundling > 0) {
      selectPaket.innerHTML += `<option value="2" data-harga="${hargaBundling}">2 Orang (Bundling) - Rp ${hargaBundling.toLocaleString('id-ID')}</option>`;
    }

    // ==== FUNGSI RESET PROMO (Biar ga nyangkut) ====
    function resetPromo() {
      diskonAktif = 0;
      persenDiskonAktif = 0;
      kodePromoDipakai = '';
      hitungTotal();
    }

    // ==== UPDATE FORM SAAT PAKET GANTI ====
    function updateForm() {
      const jumlahPeserta = parseInt(selectPaket.value);

      if (jumlahPeserta === 2) {
        grupPasangan.style.display = 'block';
        inputNamaPasangan.setAttribute('required', 'true');
        
        // Matikan promo jika bundling
        diskonAktif = 0;
        persenDiskonAktif = 0;
        kodePromoDipakai = '';
        inputKodePromo.value = '';
        
        pesanEl.style.display = 'block';
        pesanEl.style.color = 'red';
        pesanEl.style.fontWeight = 'normal';
        pesanEl.innerText = 'Kode promo tidak berlaku untuk paket Bundling.';
        
      } else {
        grupPasangan.style.display = 'none';
        inputNamaPasangan.removeAttribute('required');
        inputNamaPasangan.value = '';
        
        if (inputKodePromo.value.trim() === '') {
          pesanEl.style.display = 'none';
        }
      }

      const butuhMatras = (kategoriEvent.toLowerCase() === 'yoga' || kategoriEvent.toLowerCase() === 'pilates');
      
      if (butuhMatras) {
        grupPilihanMatras.style.display = 'block';
        if (jumlahPeserta === 1) {
          grupMatras.innerHTML = `
            <label><input type="radio" name="matras" value="bawa" checked> Bawa Sendiri</label>
            <label><input type="radio" name="matras" value="sewa1"> Sewa 1 Mat (+ Rp 10.000)</label>
          `;
        } else {
          grupMatras.innerHTML = `
            <label><input type="radio" name="matras" value="bawa" checked> Bawa Sendiri Semua</label>
            <label><input type="radio" name="matras" value="sewa1"> Sewa 1 Mat (+ Rp 10.000)</label>
            <label><input type="radio" name="matras" value="sewa2"> Sewa 2 Mat (+ Rp 20.000)</label>
          `;
        }
        grupMatras.querySelectorAll('input[name="matras"]').forEach(r => {
          r.addEventListener('change', hitungTotal);
        });
      } else {
        grupPilihanMatras.style.display = 'none';
        grupMatras.innerHTML = ''; 
      }

      hitungTotal();
    }

    // ==== HITUNG TOTAL HARGA ====
    function hitungTotal() {
      const opsiTerpilih = selectPaket.options[selectPaket.selectedIndex];
      const hargaPaket = parseInt(opsiTerpilih.getAttribute('data-harga')); 
      
      const matrasTerpilih = document.querySelector('input[name="matras"]:checked');
      const nilaiMatras = matrasTerpilih ? matrasTerpilih.value : 'bawa';
      
      let biayaMatras = 0;
      if (nilaiMatras === 'sewa1') biayaMatras = 10000;
      if (nilaiMatras === 'sewa2') biayaMatras = 20000;

      // Hitung ulang nominal diskon berdasarkan persentase & harga paket terbaru
      if (persenDiskonAktif > 0) {
        diskonAktif = Math.round(hargaPaket * (persenDiskonAktif / 100));
      }

      let totalAkhir = hargaPaket + biayaMatras - diskonAktif;
      if (totalAkhir < 0) totalAkhir = 0;

      document.getElementById('subtotalTiket').innerText = `Rp ${hargaPaket.toLocaleString('id-ID')}`;
      document.getElementById('biayaMatras').innerText = `Rp ${biayaMatras.toLocaleString('id-ID')}`;
      
      if (diskonAktif > 0) {
        document.getElementById('barisDiskon').style.display = 'flex';
        document.getElementById('nominalDiskon').innerText = `- Rp ${diskonAktif.toLocaleString('id-ID')}`;
      } else {
        document.getElementById('barisDiskon').style.display = 'none';
      }

      document.getElementById('totalAkhir').innerText = `Rp ${totalAkhir.toLocaleString('id-ID')}`;
      return totalAkhir; 
    }

    selectPaket.addEventListener('change', updateForm);
    updateForm(); // init

    // ==== FITUR TAMBAHAN: RESET PROMO SAAT USER NGEDIT TEKS ====
    inputKodePromo.addEventListener('input', function() {
      // Kalau user ngetik ulang atau ngehapus teks, hapus diskon yang lama
      if (this.value.trim().toUpperCase() !== kodePromoDipakai) {
        resetPromo();
        pesanEl.style.display = 'none';
      }
    });

    // ==== CEK PROMO ====
    btnCekPromo.addEventListener('click', async () => {
      const inputKode = inputKodePromo.value.trim().toUpperCase();
      
      if (!inputKode) {
        pesanEl.style.display = 'block';
        pesanEl.style.color = 'red';
        pesanEl.style.fontWeight = 'normal';
        pesanEl.innerText = 'Kode promo tidak boleh kosong.';
        resetPromo(); // <--- Bersihin diskon lama
        return;
      }

      try {
        const docRef = doc(db, "classes", idKelas);
        const docSnap = await getDoc(docRef);
        
        if (!docSnap.exists()) {
          pesanEl.style.display = 'block';
          pesanEl.style.color = 'red';
          pesanEl.style.fontWeight = 'normal';
          pesanEl.innerText = 'Data event tidak ditemukan.';
          resetPromo(); // <--- Bersihin diskon lama
          return;
        }

        const dataKelas = docSnap.data();

        if (!dataKelas.kodePromo || dataKelas.kodePromo === '') {
          pesanEl.style.display = 'block';
          pesanEl.style.color = 'red';
          pesanEl.style.fontWeight = 'normal';
          pesanEl.innerText = 'Event ini tidak memiliki promo.';
          resetPromo(); // <--- Bersihin diskon lama
          return;
        }

        if (inputKode !== dataKelas.kodePromo) {
          pesanEl.style.display = 'block';
          pesanEl.style.color = 'red';
          pesanEl.style.fontWeight = 'normal';
          pesanEl.innerText = 'Kode promo salah. Coba cek ulang hurufnya ya!';
          resetPromo(); // <--- Bersihin diskon lama
          return;
        }

        const ordersRef = collection(db, "orders");
        const q = query(
          ordersRef,
          where("kelas", "==", namaKelas),
          where("kodePromo", "==", inputKode),
          where("status", "in", ["Pending", "Success"])
        );
        const querySnapshot = await getDocs(q);
        
        let terpakai = 0;
        querySnapshot.forEach(() => terpakai++); 

        if (terpakai >= dataKelas.kuotaPromo) {
          pesanEl.style.display = 'block';
          pesanEl.style.color = 'red';
          pesanEl.style.fontWeight = 'normal';
          pesanEl.innerText = 'Yah, promonya udah habis bun... 🥺';
          resetPromo(); // <--- Bersihin diskon lama
          return;
        }

        const persenDiskon = dataKelas.diskonPromo || 0; 
        
        if (persenDiskon <= 0) {
          pesanEl.style.display = 'block';
          pesanEl.style.color = 'red';
          pesanEl.style.fontWeight = 'normal';
          pesanEl.innerText = 'Kode promo ini belum diatur potongannya.';
          resetPromo(); // <--- Bersihin diskon lama
          return;
        }
        
        // JIKA SEMUA VALIDASI LOLOS:
        const opsiTerpilih = selectPaket.options[selectPaket.selectedIndex];
        const hargaPaket = parseInt(opsiTerpilih.getAttribute('data-harga')); 

        persenDiskonAktif = persenDiskon;
        diskonAktif = Math.round(hargaPaket * (persenDiskon / 100));
        kodePromoDipakai = inputKode;

        pesanEl.style.display = 'block';
        pesanEl.style.color = '#10b981';
        pesanEl.style.fontWeight = 'bold';
        pesanEl.innerText = `Yeay! Kode promo berhasil. Diskon ${persenDiskon}% (Rp ${diskonAktif.toLocaleString('id-ID')})! ✨`;
        
        hitungTotal();
      } catch (error) {
        console.error(error);
        alert("Gagal mengecek kode promo.");
      }
    });

    // ==== SUBMIT FORM (redirect ke pembayaran) ====
    document.getElementById('formBooking').addEventListener('submit', (event) => {
      event.preventDefault();

      const nama = document.getElementById('nama').value;
      const email = document.getElementById('email').value;
      const wa = document.getElementById('wa').value;
      const jumlahPeserta = selectPaket.value;
      const namaPasangan = jumlahPeserta === "2" ? inputNamaPasangan.value : '';
      const catatan = document.getElementById('catatan').value;
      
      let matrasTerpilih = 'bawa';
      const radioMatras = document.querySelector('input[name="matras"]:checked');
      if (radioMatras) matrasTerpilih = radioMatras.value;

      const totalAkhir = hitungTotal();

      const paymentUrl = `payment.html?kelas=${encodeURIComponent(namaKelas)}&harga=${totalAkhir}&nama=${encodeURIComponent(nama)}&email=${encodeURIComponent(email)}&wa=${encodeURIComponent(wa)}&id=${idKelas}&peserta=${jumlahPeserta}&pasangan=${encodeURIComponent(namaPasangan)}&matras=${matrasTerpilih}&catatan=${encodeURIComponent(catatan)}&kategori=${encodeURIComponent(kategoriEvent)}&kodePromo=${encodeURIComponent(kodePromoDipakai)}`;
      
      window.location.href = paymentUrl;
    });
  </script>

</body>
</html>
