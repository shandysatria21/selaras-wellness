<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classes</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <style>
    .card-status { 
      position: absolute; 
      top: 15px; right: 15px; 
      padding: 5px 12px; 
      border-radius: 20px; 
      font-size: 0.8rem; 
      font-weight: 600; 
      color: #fff; 
      z-index: 10;
    }
    .status-active { background-color: #10b981; } 
    .status-inactive { background-color: #ef4444; } 
    .card-info-row { 
      display: flex; 
      align-items: flex-start; /* Biar ikon sejajar sama teks atas */
      gap: 8px; 
      font-size: 0.9rem; 
      color: var(--text-muted); 
      line-height: 1.4;
    }
    .card-info-row span { 
      font-weight: 500; 
      color: var(--text-main); 
    }
    .btn-disabled { background-color: #ccc !important; cursor: not-allowed; pointer-events: none; }
    .card-info-row {
      display: flex;
      align-items: flex-start; /* Ubah dari center ke flex-start */
      gap: 8px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.add('active')">☰</button>

  <aside class="sidebar">
    <button class="close-menu" onclick="document.querySelector('.sidebar').classList.remove('active')">✕</button>
    <a href="index.html" class="logo"><img src="img/SELARAS.png" alt="Logo"></a>
    <div class="menu-group">
      <a href="index.html" class="menu-item">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Home
      </a>
      <a href="classes.html" class="menu-item active">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        Classes
      </a>
      <a href="galeri.html" class="menu-item">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        Galeri
      </a>
    
      <a href="about.html" class="menu-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        About Us
      </a>
    </div>

    <div class="menu-group">
      <a href="contact.html" class="menu-item">
        <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        Contact
      </a>
    </div>
  </aside>

  <main class="main-content">
    <h1 class="page-title">Classes</h1>
    <p class="page-subtitle">Temukan jadwal kelas yang cocok untukmu.</p>

    <div class="grid-cards" id="container-kelas" style="margin-bottom: 60px;">
      <p style="text-align:center; width: 100%; color: var(--text-muted);">Memuat kelas...</p>
    </div>
  </main>

    <script type="module">
    import { firebaseConfig, app } from './firebase-config.js';
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);
    const container = document.getElementById('container-kelas');

    function formatTanggal(tglString) {
      if (!tglString) return '-';
      return new Date(tglString).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    async function muatKelasUser() {
      try {
        const q = query(collection(db, "classes"), orderBy("tanggal", "asc"));
        const querySnapshot = await getDocs(q);
        
        container.innerHTML = '';

        if (querySnapshot.empty) {
          container.innerHTML = '<p style="text-align:center; width: 100%;">Belum ada kelas yang tersedia.</p>';
          return;
        }

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const id = doc.id;
          const hargaRupiah = 'Rp ' + data.harga.toLocaleString('id-ID');
          const hargaBundlingRupiah = data.hargaBundling ? 'Rp ' + data.hargaBundling.toLocaleString('id-ID') : null;
          
          const isActive = data.statusAktif !== false;
          const isKuotaHabis = data.kuotaTersisa <= 0;
          
          let statusBadge = `<span class="card-status status-active">Aktif</span>`;
          if (!isActive) statusBadge = `<span class="card-status status-inactive">Non-Aktif</span>`;
          else if (isKuotaHabis) statusBadge = `<span class="card-status status-inactive">Kuota Habis</span>`;

          let btnBook = `<a href="form-booking.html?kelas=${encodeURIComponent(data.nama)}&harga=${data.harga}&hargaBundling=${data.hargaBundling || 0}&id=${id}" class="btn btn-primary" style="padding: 10px 20px; font-size: 0.9rem;">Book Now</a>`;
          
          if (!isActive || isKuotaHabis) {
            btnBook = `<button class="btn btn-primary btn-disabled" style="padding: 10px 20px; font-size: 0.9rem;">Tutup</button>`;
          }

          const card = document.createElement('div');
          card.className = 'card';
          
          // PERHATIKAN STRUKTUR DIV DI BAWAH INI (SUDAH DIRAPIKAN)
                    card.innerHTML = `
            <div class="card-img" style="background-image: url('${data.gambar}'); cursor: pointer;" onclick="window.location.href='detail-class.html?id=${id}'">
              ${statusBadge}
            </div>
            
            <div class="card-content" style="display: flex; flex-direction: column; flex: 1;">
              <h3 style="cursor: pointer;" onclick="window.location.href='detail-class.html?id=${id}'">${data.nama}</h3>
              
              <div class="card-info">
                <div class="card-info-row">👤 Coach: <span>${data.coach || '-'}</span></div>
                <div class="card-info-row">📅 Jadwal: <span>${formatTanggal(data.tanggal)} • ${data.jam || '-'} WIB</span></div>
                <div class="card-info-row">📍 Lokasi: <span>${data.lokasi || '-'}</span></div>
                <div class="card-info-row">🎟️ Kuota: <span>${data.kuotaTersisa || 0} / ${data.kuotaAwal || 0} tersisa</span></div>
              </div>

              <div class="card-footer" style="margin-top: auto; padding-top: 15px; border-top: 1px solid var(--border);">
                <div style="margin-bottom: 15px;">
                  <span class="price-label" style="display: block; font-size: 0.8rem;">Harga Satuan</span>
                  <span class="price-val" style="font-size: 1.2rem; display: block;">${hargaRupiah}</span>
                  ${hargaBundlingRupiah ? `<span class="price-label" style="color: #10b981; font-size: 0.85rem; display: block; margin-top: 4px;">Bundling (2 Orang): ${hargaBundlingRupiah}</span>` : ''}
                </div>

                <div style="display: flex; gap: 8px; width: 100%;">
                  <!-- Tombol Share -->
                  <button onclick="shareKelas('${data.nama}', '${id}', ${data.harga})" class="btn btn-outline" style="padding: 10px; border-radius: 8px; width: 45px; flex-shrink: 0;" title="Bagikan Kelas">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle>
                      <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                    </svg>
                  </button>
                  
                  <!-- Tombol Detail (Ganti Book Now) -->
                  <div style="flex: 1;">
                    <a href="detail-class.html?id=${id}" class="btn btn-primary" style="padding: 10px; font-size: 0.9rem; width: 100%; display: flex; justify-content: center; align-items: center;">Lihat Detail</a>
                  </div>
                </div>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (error) {
        console.error("Error memuat kelas: ", error);
        container.innerHTML = '<p style="text-align:center; width: 100%; color: red;">Gagal memuat data.</p>';
      }
    }

    muatKelasUser();

    // Fungsi Share Kelas
    window.shareKelas = function(namaKelas, idKelas, hargaKelas) {
      const linkBooking = `${window.location.origin}/form-booking.html?kelas=${encodeURIComponent(namaKelas)}&harga=${hargaKelas}&id=${idKelas}`;
      
      const textShare = `Yuk ikutan kelas *${namaKelas}* di Selaras Wellness Club! 🧘‍♀️\n\nCek jadwal dan daftar di sini:\n${linkBooking}`;

      if (navigator.share) {
        navigator.share({
          title: `Kelas ${namaKelas} - Selaras`,
          text: `Yuk ikutan kelas ${namaKelas} di Selaras Wellness Club!`,
          url: linkBooking
        }).catch((error) => console.log('Share dibatalkan', error));
      } else {
        window.open(`https://wa.me/?text=${encodeURIComponent(textShare)}`, '_blank');
      }
    }
  </script>

</body>
</html>
