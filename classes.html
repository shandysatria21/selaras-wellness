  <!-- KONTEN UTAMA -->
  <main class="main-content">
    
    <!-- DAFTAR KELAS DINAMIS -->
    <h1 class="page-title">Classes & Pricing</h1>
    <p class="page-subtitle">Temukan kelas yang cocok dan paket terbaik untukmu.</p>

    <!-- Wadah untuk kartu-kartu kelas dari Firebase -->
    <div class="grid-cards" id="container-kelas" style="margin-bottom: 60px;">
      <!-- Akan diisi oleh JavaScript -->
      <p style="text-align:center; width: 100%; color: var(--text-muted);">Memuat kelas...</p>
    </div>

  </main>

  <!-- SCRIPT FIREBASE UNTUK USER -->
  <script type="module">
    import { firebaseConfig, app } from './firebase-config.js';
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);
    const container = document.getElementById('container-kelas');

    async function muatKelasUser() {
      try {
        const querySnapshot = await getDocs(collection(db, "classes"));
        
        container.innerHTML = ''; // Hapus tulisan "Memuat kelas..."

        if (querySnapshot.empty) {
          container.innerHTML = '<p style="text-align:center; width: 100%;">Belum ada kelas yang tersedia.</p>';
          return;
        }

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const hargaRupiah = 'Rp ' + data.harga.toLocaleString('id-ID');
          
          // Tentukan warna badge level
          let badgeClass = 'level-all';
          if (data.level.toLowerCase().includes('inter')) badgeClass = 'level-int';
          if (data.level.toLowerCase().includes('beg')) badgeClass = 'level-all'; // Bisa disesuaikan

          // Buat HTML Kartu
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-img" style="background-image: url('${data.gambar}');">
              <span class="card-label">${data.level}</span>
            </div>
            <div class="card-content">
              <h3>${data.nama}</h3>
              <div class="card-info">
                <div class="info-row"><span class="info-label">Level</span><span class="badge-level ${badgeClass}">${data.level}</span></div>
                <div class="info-row"><span class="info-label">Duration (min)</span><span class="info-val">${data.durasi}</span></div>
              </div>
              <div class="card-footer">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                  <div>
                    <span class="price-label">Price</span>
                    <span class="price-val">${hargaRupiah}</span>
                  </div>
                  <!-- Tombol Book Now membawa data kelas ke form booking -->
                  <a href="form-booking.html?kelas=${encodeURIComponent(data.nama)}&harga=${data.harga}" class="btn btn-primary" style="padding: 10px 20px; font-size: 0.9rem;">Book Now</a>
                </div>
              </div>
            </div>
          `;
          container.appendChild(card);
        });

      } catch (error) {
        console.error("Error memuat kelas: ", error);
        container.innerHTML = '<p style="text-align:center; width: 100%; color: red;">Gagal memuat data kelas.</p>';
      }
    }

    muatKelasUser();
  </script>

</body>
</html>
