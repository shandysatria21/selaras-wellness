    .card-status { position: absolute; top: 15px; right: 15px; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; color: #fff; }
    .status-active { background-color: #10b981; } /* Hijau */
    .status-inactive { background-color: #ef4444; } /* Merah */
    
    .card-info-row { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 8px; }
    .card-info-row span { font-weight: 500; color: var(--text-main); }
    
    .btn-disabled { background-color: #ccc !important; cursor: not-allowed; pointer-events: none; }
  </style>
</head>
<body>

  <main class="main-content">
    <h1 class="page-title">Classes & Pricing</h1>
    <p class="page-subtitle">Temukan jadwal kelas yang cocok untukmu.</p>

    <div class="grid-cards" id="container-kelas" style="margin-bottom: 60px;">
      <p style="text-align:center; width: 100%; color: var(--text-muted);">Memuat kelas...</p>
    </div>
  </main>

  <script type="module">
    import { firebaseConfig, app } from './firebase-config.js';
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);
    const container = document.getElementById('container-kelas');

    // Format tanggal agar cantik (misal: 2026-06-15 -> 15 Jun 2026)
    function formatTanggal(tglString) {
      if (!tglString) return '-';
      const options = { day: 'numeric', month: 'short', year: 'numeric' };
      return new Date(tglString).toLocaleDateString('id-ID', options);
    }

    async function muatKelasUser() {
      try {
        // Ambil semua kelas (termasuk non-aktif agar bisa ditampilkan badge-nya)
        const q = query(collection(db, "classes"), orderBy("tanggal", "asc"));
        const querySnapshot = await getDocs(q);
        
        container.innerHTML = '';

        if (querySnapshot.empty) {
          container.innerHTML = '<p style="text-align:center; width: 100%;">Belum ada kelas yang tersedia.</p>';
          return;
        }

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const id = doc.id;
          const hargaRupiah = 'Rp ' + data.harga.toLocaleString('id-ID');
          
          // Logika Tombol & Status
          const isActive = data.statusAktif !== false; // Jika undefined (data lama), anggap aktif
          const isKuotaHabis = data.kuotaTersisa <= 0;
          
          let statusBadge = `<span class="card-status status-active">Aktif</span>`;
          if (!isActive) statusBadge = `<span class="card-status status-inactive">Non-Aktif</span>`;
          else if (isKuotaHabis) statusBadge = `<span class="card-status status-inactive">Kuota Habis</span>`;

          let btnBook = `<a href="form-booking.html?kelas=${encodeURIComponent(data.nama)}&harga=${data.harga}&id=${id}" class="btn btn-primary" style="padding: 10px 20px; font-size: 0.9rem;">Book Now</a>`;
          
          if (!isActive || isKuotaHabis) {
            btnBook = `<button class="btn btn-primary btn-disabled" style="padding: 10px 20px; font-size: 0.9rem;">Tutup</button>`;
          }

          // Buat HTML Kartu
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-img" style="background-image: url('${data.gambar}');">
              ${statusBadge}
            </div>
            <div class="card-content">
              <h3 style="margin-bottom: 15px;">${data.nama}</h3>
              
              <div class="card-info-row">👤 Coach: <span>${data.coach || '-'}</span></div>
              <div class="card-info-row">📅 Tanggal: <span>${formatTanggal(data.tanggal)}</span></div>
              <div class="card-info-row">📍 Lokasi: <span>${data.lokasi || '-'}</span></div>
              <div class="card-info-row">🎟️ Kuota: <span>${data.kuotaTersisa || 0} / ${data.kuotaAwal || 0} tersisa</span></div>

              <div class="card-footer" style="margin-top: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                  <div>
                    <span class="price-label">Price</span>
                    <span class="price-val">${hargaRupiah}</span>
                  </div>
                  ${btnBook}
                </div>
              </div>
            </div>
          `;
          container.appendChild(card);
        });

      } catch (error) {
        console.error("Error memuat kelas: ", error);
        container.innerHTML = '<p style="text-align:center; width: 100%; color: red;">Gagal memuat data.</p>';
      }
    }

    muatKelasUser();
  </script>

</body>
</html>
