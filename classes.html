<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classes & Pricing</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .card-status { 
      position: absolute; 
      top: 15px; right: 15px; 
      padding: 5px 12px; 
      border-radius: 20px; 
      font-size: 0.8rem; 
      font-weight: 600; 
      color: #fff; 
      z-index: 10;
    }
    .status-active { background-color: #10b981; } 
    .status-inactive { background-color: #ef4444; } 
    .card-info-row { 
      display: flex; 
      align-items: flex-start; /* Biar ikon sejajar sama teks atas */
      gap: 8px; 
      font-size: 0.9rem; 
      color: var(--text-muted); 
      line-height: 1.4;
    }
    .card-info-row span { 
      font-weight: 500; 
      color: var(--text-main); 
    }
    .btn-disabled { background-color: #ccc !important; cursor: not-allowed; pointer-events: none; }
  </style>
</head>
<body>

  <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.add('active')">☰</button>

  <aside class="sidebar">
    <button class="close-menu" onclick="document.querySelector('.sidebar').classList.remove('active')">✕</button>
    <a href="index.html" class="logo"><img src="img/SELARAS.png" alt="Logo"></a>
    <div class="menu-group">
      <a href="index.html" class="menu-item">Home</a>
      <a href="classes.html" class="menu-item active">Classes</a>
      <a href="galeri.html" class="menu-item">Galeri</a>
      <a href="about.html" class="menu-item">About Us</a>
    </div>
    <div class="menu-group">
      <a href="contact.html" class="menu-item">Contact</a>
    </div>
  </aside>

  <main class="main-content">
    <h1 class="page-title">Classes</h1>
    <p class="page-subtitle">Temukan jadwal kelas yang cocok untukmu.</p>

    <div class="grid-cards" id="container-kelas" style="margin-bottom: 60px;">
      <p style="text-align:center; width: 100%; color: var(--text-muted);">Memuat kelas...</p>
    </div>
  </main>

  <script type="module">
    import { firebaseConfig, app } from './firebase-config.js';
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);
    const container = document.getElementById('container-kelas');

    function formatTanggal(tglString) {
      if (!tglString) return '-';
      return new Date(tglString).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    async function muatKelasUser() {
      try {
        const q = query(collection(db, "classes"), orderBy("tanggal", "asc"));
        const querySnapshot = await getDocs(q);
        
        container.innerHTML = '';

        if (querySnapshot.empty) {
          container.innerHTML = '<p style="text-align:center; width: 100%;">Belum ada kelas yang tersedia.</p>';
          return;
        }

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const id = doc.id;
          const hargaRupiah = 'Rp ' + data.harga.toLocaleString('id-ID');
          const hargaBundlingRupiah = data.hargaBundling ? 'Rp ' + data.hargaBundling.toLocaleString('id-ID') : null;
          
          const isActive = data.statusAktif !== false;
          const isKuotaHabis = data.kuotaTersisa <= 0;
          
          let statusBadge = `<span class="card-status status-active">Aktif</span>`;
          if (!isActive) statusBadge = `<span class="card-status status-inactive">Non-Aktif</span>`;
          else if (isKuotaHabis) statusBadge = `<span class="card-status status-inactive">Kuota Habis</span>`;

          let btnBook = `<a href="form-booking.html?kelas=${encodeURIComponent(data.nama)}&harga=${data.harga}&hargaBundling=${data.hargaBundling || 0}&id=${id}" class="btn btn-primary" style="padding: 10px 20px; font-size: 0.9rem;">Book Now</a>`;
          
          if (!isActive || isKuotaHabis) {
            btnBook = `<button class="btn btn-primary btn-disabled" style="padding: 10px 20px; font-size: 0.9rem;">Tutup</button>`;
          }

          const card = document.createElement('div');
          card.className = 'card';
                    card.innerHTML = `
            <div class="card-img" style="background-image: url('${data.gambar}');">
              ${statusBadge}
            </div>
            <div class="card-content">
              <h3>${data.nama}</h3>
              
              <div class="card-info">
                <div class="card-info-row">👤 Coach: <span>${data.coach || '-'}</span></div>
                <div class="card-info-row">📅 Jadwal: <span>${formatTanggal(data.tanggal)} • ${data.jam || '-'} WIB</span></div>
                <div class="card-info-row">📍 Lokasi: <span>${data.lokasi || '-'}</span></div>
                <div class="card-info-row">🎟️ Kuota: <span>${data.kuotaTersisa || 0} / ${data.kuotaAwal || 0} tersisa</span></div>
              </div>

              <div class="card-footer">
                <div style="display: flex; flex-direction: column; gap: 10px;">
                  <div>
                    <span class="price-label" style="display: block; font-size: 0.8rem;">Harga Satuan</span>
                    <span class="price-val" style="font-size: 1.2rem;">${hargaRupiah}</span>
                    ${hargaBundlingRupiah ? `<div style="margin-top: 4px;"><span class="price-label" style="color: #10b981; font-size: 0.85rem;">Bundling (2 Orang): ${hargaBundlingRupiah}</span></div>` : ''}
                  </div>
                  <div style="margin-top: 10px;">
                    ${btnBook.replace('padding: 10px 20px; font-size: 0.9rem;', 'padding: 10px; font-size: 0.9rem; width: 100%; text-align: center;')}
                  </div>
                </div>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (error) {
        console.error("Error memuat kelas: ", error);
        container.innerHTML = '<p style="text-align:center; width: 100%; color: red;">Gagal memuat data.</p>';
      }
    }

    muatKelasUser();
  </script>

</body>
</html>
