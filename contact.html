  <main class="main-content">
    <h1 class="page-title">Get in Touch</h1>
    <p class="page-subtitle">Punya pertanyaan? Kami siap membantu.</p>

    <div class="contact-wrapper">
      <!-- Info Kontak -->
      <div class="contact-info-card">
        <h3 style="margin-bottom: 20px;">Informasi Kontak</h3>
        
        <div class="contact-info-item">
          <h4>📍 Lokasi Studio</h4>
          <p id="infoAlamat">Memuat...</p>
        </div>
        
        <div class="contact-info-item">
          <h4>📞 Telepon</h4>
          <p id="infoTelepon">Memuat...</p>
        </div>
        
        <div class="contact-info-item">
          <h4>✉️ Email</h4>
          <p>hello@selarasyoga.com</p>
        </div>
        
        <div class="contact-info-item" style="margin-bottom: 0;">
          <h4>🕒 Jam Operasional</h4>
          <p>Senin - Minggu<br>06.00 - 20.00 WIB</p>
        </div>
      </div>

      <!-- Form Kontak -->
      <div class="contact-form-card">
        <h3 style="margin-bottom: 20px;">Kirim Pesan</h3>
        <form id="formKontak">
          <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="inpNama" class="form-control" placeholder="Masukkan nama" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="inpEmail" class="form-control" placeholder="email@contoh.com" required>
          </div>
          <div class="form-group">
            <label>Pesan</label>
            <textarea id="inpPesan" class="form-control" placeholder="Tulis pesan Anda di sini..." required></textarea>
          </div>
          <button type="submit" id="btnKirim" class="btn btn-primary" style="width: 100%;">Kirim Pesan</button>
        </form>
      </div>
    </div>
  </main>

  <script type="module">
    import { firebaseConfig, app } from './firebase-config.js';
    import { getFirestore, collection, addDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);

    // 1. Ambil Info Kontak dari Pengaturan
    async function loadInfoKontak() {
      try {
        const docRef = doc(db, "pengaturan", "data-web");
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById('infoAlamat').innerText = data.contactAlamat || "Jl. Ketenangan No. 88, Bandung";
          document.getElementById('infoTelepon').innerText = data.contactWa || "+62 812 3456 7890";
        }
      } catch (error) {
        console.error("Error load info: ", error);
      }
    }
    loadInfoKontak();

    // 2. Proses Kirim Pesan
    document.getElementById('formKontak').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btnKirim = document.getElementById('btnKirim');
      btnKirim.innerText = 'Mengirim...';
      btnKirim.disabled = true;

      try {
        await addDoc(collection(db, "pesan_kontak"), {
          nama: document.getElementById('inpNama').value,
          email: document.getElementById('inpEmail').value,
          pesan: document.getElementById('inpPesan').value,
          tanggal: new Date()
        });

        alert('Pesan Anda berhasil terkirim! Kami akan segera menghubungi Anda.');
        document.getElementById('formKontak').reset();
      } catch (error) {
        console.error("Error kirim pesan: ", error);
        alert('Gagal mengirim pesan. Silakan coba lagi.');
      } finally {
        btnKirim.innerText = 'Kirim Pesan';
        btnKirim.disabled = false;
      }
    });
  </script>

</body>
